name: AI integration and orchestration examples
on:
  pull_request:
    paths:
      - 'examples/llm-integration/**'
      - 'examples/ai-agents/**'
      - 'examples/langgraph/**'
      - '.github/workflows/ai-examples.yml'
permissions:
  contents: read
concurrency:
  group: ai-examples-${{ github.ref }}
  cancel-in-progress: true
jobs:
  examples:
    name: ai-${{ matrix.example }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        example: [llm-integration, ai-agents, langgraph]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: examples/${{ matrix.example }}/package-lock.json
      - run: npm ci --prefix examples/${{ matrix.example }}
      - run: npm test --prefix examples/${{ matrix.example }}

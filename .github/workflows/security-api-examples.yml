name: Security and API examples
on:
  pull_request:
    paths:
      - 'examples/application-security/**'
      - 'examples/supertest/**'
      - 'examples/testcontainers/**'
      - '.github/workflows/security-api-examples.yml'
permissions:
  contents: read
jobs:
  examples:
    name: ${{ matrix.example }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        example: [application-security, supertest, testcontainers]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: examples/${{ matrix.example }}/package-lock.json
      - name: Verify Docker runtime
        if: matrix.example == 'testcontainers'
        run: docker info
      - name: Install locked dependencies
        run: npm ci --prefix examples/${{ matrix.example }}
      - name: Compile and run example tests
        run: npm test --prefix examples/${{ matrix.example }}

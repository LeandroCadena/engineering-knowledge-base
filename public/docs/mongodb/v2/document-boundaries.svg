<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="375" viewBox="0 0 1000 375" role="img" aria-labelledby="title desc"><title id="title">Bounded document and independent event records</title><desc id="desc">An account owns bounded embedded profile values. Independently growing events are referenced by account identity and indexed separately rather than appended to an unlimited array.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8da3b8"/></marker></defs><rect width="1000" height="375" rx="20" fill="#0d1828"/><path d="M190 125 V240" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="205" y="190" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">contains</text><path d="M600 82 H340" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="360" y="65" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">accountId reference</text><path d="M775 125 V240" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="790" y="190" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">indexed</text><rect x="40" y="40" width="300" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="190.0" y="71" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Account document</text><text x="190.0" y="99" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">ID + source + balance</text><rect x="40" y="240" width="300" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="190.0" y="271" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Embedded profile</text><text x="190.0" y="299" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Bounded owned values</text><rect x="600" y="40" width="350" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="775.0" y="71" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Inbox collection</text><text x="775.0" y="99" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Independent event records</text><rect x="600" y="240" width="350" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="775.0" y="271" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Source + event ID index</text><text x="775.0" y="299" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Unique delivery identity</text></svg>
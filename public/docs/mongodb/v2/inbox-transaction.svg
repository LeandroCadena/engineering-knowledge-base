<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="375" viewBox="0 0 1000 375" role="img" aria-labelledby="title desc"><title id="title">Atomic accepted event and account update</title><desc id="desc">The transaction inserts a unique accepted identity and updates the permitted account before commit. A failure aborts both writes; a duplicate is resolved after the transaction exits.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8da3b8"/></marker></defs><rect width="1000" height="375" rx="20" fill="#0d1828"/><path d="M310 82 H390" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M660 82 H720" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M840 125 V245" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="855" y="190" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">success</text><path d="M720 105 H690 V287 H660" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="665" y="210" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">failure</text><path d="M525 125 V190 H175 V245" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="190" y="175" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">duplicate key</text><rect x="40" y="40" width="270" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="175.0" y="71" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Verified event</text><text x="175.0" y="99" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Source + ID + fingerprint</text><rect x="390" y="40" width="270" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="525.0" y="71" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Transaction: insert inbox</text><text x="525.0" y="99" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Unique source + event ID</text><rect x="720" y="40" width="240" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="840.0" y="71" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Update account</text><text x="840.0" y="99" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Match source; increment</text><rect x="720" y="245" width="240" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="840.0" y="276" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Commit</text><text x="840.0" y="304" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Both database writes</text><rect x="390" y="245" width="270" height="85" rx="12" fill="#142438" stroke="#ef939d" stroke-width="2"/><text x="525.0" y="276" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Abort</text><text x="525.0" y="304" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Neither write accepted</text><rect x="40" y="245" width="270" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="175.0" y="276" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Duplicate identity</text><text x="175.0" y="304" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Compare stored fingerprint</text></svg>
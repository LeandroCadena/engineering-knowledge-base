<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#94abc0"/></marker></defs><rect width="1000" height="390" rx="20" fill="#0d1928"/><rect x="40" y="50" width="250" height="80" rx="12" fill="#17283b" stroke="#b9a0f5" stroke-width="2"/><text x="165.0" y="81" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#dceaf7">Catalog context</text><text x="165.0" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#dceaf7">Current offer</text><rect x="375" y="50" width="250" height="80" rx="12" fill="#17283b" stroke="#b9a0f5" stroke-width="2"/><text x="500.0" y="81" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#dceaf7">Ordering context</text><text x="500.0" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#dceaf7">Agreed line price</text><rect x="710" y="50" width="250" height="80" rx="12" fill="#17283b" stroke="#b9a0f5" stroke-width="2"/><text x="835.0" y="81" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#dceaf7">Fulfillment context</text><text x="835.0" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#dceaf7">Shipment item</text><path d="M290 90 H375" fill="none" stroke="#94abc0" stroke-width="2" marker-end="url(#arrow)"/><path d="M625 90 H710" fill="none" stroke="#94abc0" stroke-width="2" marker-end="url(#arrow)"/><text x="332" y="146" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#dceaf7">Translate</text><text x="667" y="146" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#dceaf7">Publish</text><rect x="375" y="245" width="250" height="80" rx="12" fill="#17283b" stroke="#4bddb3" stroke-width="2"/><text x="500.0" y="276" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#dceaf7">Order aggregate</text><text x="500.0" y="303" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#dceaf7">Lines + total + lifecycle</text><path d="M500 130 V245" fill="none" stroke="#94abc0" stroke-width="2" marker-end="url(#arrow)"/><text x="180" y="295" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#dceaf7">Shared identifiers</text><text x="180" y="325" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#dceaf7">do not imply one model.</text><text x="814" y="295" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#dceaf7">Each context owns</text><text x="814" y="325" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#dceaf7">its local meaning.</text></svg>
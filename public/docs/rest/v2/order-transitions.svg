<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc"><title id="title">Order cancellation as resource transition</title><desc id="desc">An open order exposes a cancellation relation. Creating a cancellation produces its own resource and changes the order, which no longer exposes that action.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8da3b8"/></marker></defs><rect width="1000" height="410" rx="20" fill="#0d1828"/><path d="M310 87 H390" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="325" y="70" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">follow</text><path d="M660 87 H720" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M840 130 V285" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="800" y="215" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">follow Location</text><path d="M720 327 H660" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="670" y="311" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">order</text><path d="M390 327 H310" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="45" width="270" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="175.0" y="76" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Order: open</text><text x="175.0" y="104" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">self + cancel relations</text><rect x="390" y="45" width="270" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="525.0" y="76" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">POST cancellations</text><text x="525.0" y="104" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Recheck state and permission</text><rect x="720" y="45" width="240" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="840.0" y="76" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Cancellation created</text><text x="840.0" y="104" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">201 + its Location</text><rect x="40" y="285" width="270" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="175.0" y="316" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Order: cancelled</text><text x="175.0" y="344" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">self; no cancel control</text><rect x="390" y="285" width="270" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="525.0" y="316" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">GET order relation</text><text x="525.0" y="344" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Retrieve current state</text><rect x="720" y="285" width="240" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="840.0" y="316" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">GET cancellation</text><text x="840.0" y="344" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Retrieve result + order link</text></svg>
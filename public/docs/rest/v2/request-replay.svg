<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc"><title id="title">Request-key replay contract</title><desc id="desc">A new key creates an operation result. A repeated key with equivalent input returns the stored result; a different payload conflicts without another effect.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8da3b8"/></marker></defs><rect width="1000" height="570" rx="20" fill="#0d1828"/><path d="M310 87 H390" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M660 87 H720" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="670" y="70" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">new</text><path d="M525 130 V245" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="540" y="190" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">known</text><path d="M390 287 H175 V445" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="185" y="390" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">match</text><path d="M525 330 V445" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="540" y="390" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">mismatch</text><path d="M840 130 V245" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M720 287 H660" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="675" y="270" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">retry</text><rect x="40" y="45" width="270" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="175.0" y="76" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Creation request</text><text x="175.0" y="104" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Scoped key + input</text><rect x="390" y="45" width="270" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="525.0" y="76" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Request-key decision</text><text x="525.0" y="104" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">New or already recorded?</text><rect x="720" y="45" width="240" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="840.0" y="76" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">New key</text><text x="840.0" y="104" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Create and record result</text><rect x="390" y="245" width="270" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="525.0" y="276" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Existing key</text><text x="525.0" y="304" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Compare normalized input</text><rect x="40" y="445" width="270" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="175.0" y="476" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Equivalent input</text><text x="175.0" y="504" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Return original result</text><rect x="390" y="445" width="270" height="85" rx="12" fill="#142438" stroke="#ef939d" stroke-width="2"/><text x="525.0" y="476" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Different input</text><text x="525.0" y="504" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">409; do not repeat effect</text><rect x="720" y="245" width="240" height="85" rx="12" fill="#142438" stroke="#ef939d" stroke-width="2"/><text x="840.0" y="276" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Response lost</text><text x="840.0" y="304" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Client retries the same key</text></svg>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1000 460"
  role="img"
  aria-label="Verified actor and untrusted conversation input enter an ownership check before the backend selects the Runtime session"
>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#a4baff" />
    </marker>
  </defs>
  <rect width="1000" height="460" rx="16" fill="#0f172a" />
  <g font-family="system-ui,sans-serif">
    <path d="M295 80 365 160" fill="none" stroke="#a4baff" stroke-width="3" marker-end="url(#a)" />
    <path d="M295 280 365 200" fill="none" stroke="#a4baff" stroke-width="3" marker-end="url(#a)" />
    <path d="M635 180H705" fill="none" stroke="#a4baff" stroke-width="3" marker-end="url(#a)" />
    <path d="M840 230V330" fill="none" stroke="#a4baff" stroke-width="3" marker-end="url(#a)" />
    <rect x="25" y="30" width="270" height="100" rx="12" fill="#172033" stroke="#a4baff" />
    <text x="160" y="68" text-anchor="middle" fill="#a4baff" font-size="23" font-weight="600">
      Verified actor
    </text>
    <text x="160" y="104" text-anchor="middle" fill="#e2e8f0" font-size="19">
      Tenant + user identity
    </text>
    <rect x="25" y="230" width="270" height="100" rx="12" fill="#172033" stroke="#f19db3" />
    <text x="160" y="268" text-anchor="middle" fill="#f19db3" font-size="23" font-weight="600">
      Client request
    </text>
    <text x="160" y="304" text-anchor="middle" fill="#e2e8f0" font-size="19">
      Conversation ID + prompt
    </text>
    <rect x="365" y="130" width="270" height="100" rx="12" fill="#172033" stroke="#a4baff" />
    <text x="500" y="168" text-anchor="middle" fill="#a4baff" font-size="23" font-weight="600">
      Backend directory
    </text>
    <text x="500" y="204" text-anchor="middle" fill="#e2e8f0" font-size="19">
      Owned Runtime session ID
    </text>
    <rect x="705" y="130" width="270" height="100" rx="12" fill="#172033" stroke="#a4baff" />
    <text x="840" y="168" text-anchor="middle" fill="#a4baff" font-size="23" font-weight="600">
      Runtime session
    </text>
    <text x="840" y="204" text-anchor="middle" fill="#e2e8f0" font-size="19">Isolated compute</text>
    <rect x="705" y="330" width="270" height="100" rx="12" fill="#172033" stroke="#a4baff" />
    <text x="840" y="368" text-anchor="middle" fill="#a4baff" font-size="23" font-weight="600">
      Dependencies
    </text>
    <text x="840" y="404" text-anchor="middle" fill="#e2e8f0" font-size="19">
      Role + domain access
    </text>
  </g>
</svg>

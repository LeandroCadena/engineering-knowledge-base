<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc"><title id="title">External effect and checkpoint windows</title><desc id="desc">Effect before checkpoint can repeat after a crash. Checkpoint before effect can omit the effect after a crash. A Kafka checkpoint alone is not an external-system transaction.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8da3b8"/></marker></defs><rect width="1000" height="480" rx="20" fill="#0d1828"/><path d="M310 82 H390" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M660 82 H720" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M310 317 H390" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M660 317 H720" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="40" width="270" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="175.0" y="71" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Read record n</text><text x="175.0" y="99" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Effect-first workflow</text><rect x="390" y="40" width="270" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="525.0" y="71" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">External effect</text><text x="525.0" y="99" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">May already be durable</text><rect x="720" y="40" width="240" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="840.0" y="71" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Commit n + 1</text><text x="840.0" y="99" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Checkpoint after effect</text><rect x="40" y="275" width="270" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="175.0" y="306" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Read record n</text><text x="175.0" y="334" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Checkpoint-first workflow</text><rect x="390" y="275" width="270" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="525.0" y="306" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Commit n + 1</text><text x="525.0" y="334" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Recovery starts after n</text><rect x="720" y="275" width="240" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="840.0" y="306" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">External effect</text><text x="840.0" y="334" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Not part of checkpoint</text><text x="390" y="185" fill="#ef939d" font-family="Arial,sans-serif" font-size="19">Crash before checkpoint: effect may repeat</text><text x="390" y="420" fill="#ef939d" font-family="Arial,sans-serif" font-size="19">Crash before effect: work may be omitted</text></svg>
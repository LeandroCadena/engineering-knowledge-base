<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc"><title id="title">Partition offsets and independent checkpoints</title><desc id="desc">Two partitions retain records independently. Each consumer group tracks its own next offset for each partition; reading does not delete the records.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8da3b8"/></marker></defs><rect width="1000" height="410" rx="20" fill="#0d1828"/><path d="M440 70 H650" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="450" y="25" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">read independently</text><path d="M440 95 H530 V285 H650" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M440 285 H500 V105 H650" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M440 310 H650" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="450" y="365" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">read independently</text><rect x="40" y="40" width="400" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="240.0" y="71" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Partition 0</text><text x="240.0" y="99" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Offsets 0, 1, 2, 3, ...</text><rect x="40" y="260" width="400" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="240.0" y="291" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Partition 1</text><text x="240.0" y="319" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Offsets 0, 1, 2, 3, ...</text><rect x="650" y="40" width="310" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="805.0" y="71" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Fulfillment group</text><text x="805.0" y="99" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Next offsets: P0=3, P1=2</text><rect x="650" y="260" width="310" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="805.0" y="291" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Analytics group</text><text x="805.0" y="319" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Next offsets: P0=1, P1=0</text></svg>
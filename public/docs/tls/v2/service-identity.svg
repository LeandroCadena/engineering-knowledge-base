<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="375" viewBox="0 0 1000 375" role="img" aria-labelledby="title desc"><title id="title">Certificate path and requested service</title><desc id="desc">A trusted path and a matching service identifier are both necessary. A server-supplied root is not automatically trusted, and a valid path alone does not establish the requested name.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8da3b8"/></marker></defs><rect width="1000" height="375" rx="20" fill="#0d1828"/><path d="M310 82 H390" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="325" y="65" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">signs</text><path d="M660 82 H720" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="670" y="65" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">signs</text><path d="M840 125 V180 H525 V245" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M175 125 V195 H440 V245" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M310 287 H390" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M660 287 H720" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="40" width="270" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="175.0" y="71" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Configured trust anchor</text><text x="175.0" y="99" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Local client policy</text><rect x="390" y="40" width="270" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="525.0" y="71" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Intermediate certificate</text><text x="525.0" y="99" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">CA constraints and signature</text><rect x="720" y="40" width="240" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="840.0" y="71" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Leaf certificate</text><text x="840.0" y="99" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Service SAN + public key</text><rect x="40" y="245" width="270" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="175.0" y="276" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Expected service</text><text x="175.0" y="304" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">orders.example.test</text><rect x="390" y="245" width="270" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="525.0" y="276" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Service and path checks</text><text x="525.0" y="304" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Name, validity, trust</text><rect x="720" y="245" width="240" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="840.0" y="276" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Handshake proof</text><text x="840.0" y="304" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Private-key possession</text></svg>
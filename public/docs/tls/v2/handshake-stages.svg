<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" role="img" aria-labelledby="title desc"><title id="title">TLS 1.3 full handshake stages</title><desc id="desc">Hello key shares establish handshake protection. The server certificate flight and client Finished are encrypted before the ordinary application-data exchange.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8da3b8"/></marker></defs><rect width="1000" height="690" rx="20" fill="#0d1828"/><rect x="30" y="25" width="260" height="60" rx="10" fill="#142438" stroke="#65b4e4"/><text x="160" y="62" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Client</text><path d="M160 85 V660" stroke="#40566b" stroke-dasharray="7 7"/><rect x="710" y="25" width="260" height="60" rx="10" fill="#142438" stroke="#65b4e4"/><text x="840" y="62" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Server</text><path d="M840 85 V660" stroke="#40566b" stroke-dasharray="7 7"/><path d="M160 145 H840" stroke="#8da3b8" stroke-width="2" marker-end="url(#a)"/><text x="500" y="133" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="18">ClientHello: supported parameters + key share</text><path d="M840 225 H160" stroke="#8da3b8" stroke-width="2" marker-end="url(#a)"/><text x="500" y="213" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="18">ServerHello: selection + key share</text><text x="500" y="275" text-anchor="middle" fill="#b7a0f0" font-family="Arial,sans-serif" font-size="18">Derive handshake protection keys</text><path d="M840 345 H160" stroke="#8da3b8" stroke-width="2" marker-end="url(#a)"/><text x="500" y="333" text-anchor="middle" fill="#5ed1ad" font-family="Arial,sans-serif" font-size="18">Encrypted: extensions, certificate, proof, Finished</text><text x="180" y="395" fill="#b7a0f0" font-family="Arial,sans-serif" font-size="18">Validate chain, name, transcript and proof</text><path d="M160 465 H840" stroke="#8da3b8" stroke-width="2" marker-end="url(#a)"/><text x="500" y="453" text-anchor="middle" fill="#5ed1ad" font-family="Arial,sans-serif" font-size="18">Encrypted: client Finished</text><path d="M160 555 H840" stroke="#8da3b8" stroke-width="2" marker-end="url(#a)"/><text x="500" y="543" text-anchor="middle" fill="#65b4e4" font-family="Arial,sans-serif" font-size="18">Application request under application traffic keys</text><path d="M840 635 H160" stroke="#8da3b8" stroke-width="2" marker-end="url(#a)"/><text x="500" y="623" text-anchor="middle" fill="#65b4e4" font-family="Arial,sans-serif" font-size="18">Application response under separate traffic keys</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#94abc0"/></marker></defs><rect width="1000" height="440" rx="20" fill="#0d1928"/><rect x="40" y="55" width="250" height="80" rx="12" fill="#17283b" stroke="#b9a0f5" stroke-width="2"/><text x="165.0" y="86" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#dceaf7">Start dependency</text><text x="165.0" y="113" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#dceaf7">Image + runtime</text><rect x="375" y="55" width="250" height="80" rx="12" fill="#17283b" stroke="#b9a0f5" stroke-width="2"/><text x="500.0" y="86" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#dceaf7">Wait for readiness</text><text x="500.0" y="113" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#dceaf7">Bounded startup</text><rect x="710" y="55" width="250" height="80" rx="12" fill="#17283b" stroke="#4bddb3" stroke-width="2"/><text x="835.0" y="86" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#dceaf7">Connect + migrate</text><text x="835.0" y="113" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#dceaf7">Real SQL schema</text><path d="M290 95 H375" fill="none" stroke="#94abc0" stroke-width="2" marker-end="url(#arrow)"/><path d="M625 95 H710" fill="none" stroke="#94abc0" stroke-width="2" marker-end="url(#arrow)"/><rect x="710" y="280" width="250" height="80" rx="12" fill="#17283b" stroke="#b9a0f5" stroke-width="2"/><text x="835.0" y="311" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#dceaf7">Repository tests</text><text x="835.0" y="338" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#dceaf7">Commit / rollback / races</text><rect x="375" y="280" width="250" height="80" rx="12" fill="#17283b" stroke="#57bde9" stroke-width="2"/><text x="500.0" y="311" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#dceaf7">Finally cleanup</text><text x="500.0" y="338" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#dceaf7">Pool ends → container stops</text><path d="M835 135 V280" fill="none" stroke="#94abc0" stroke-width="2" marker-end="url(#arrow)"/><path d="M710 320 H625" fill="none" stroke="#94abc0" stroke-width="2" marker-end="url(#arrow)"/><path d="M500 135 V280" fill="none" stroke="#94abc0" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="570" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#dceaf7">Failure path</text><text x="150" y="313" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#dceaf7">Cleanup remains</text><text x="150" y="343" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#dceaf7">owned and awaited.</text></svg>
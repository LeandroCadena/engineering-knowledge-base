<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc"><title id="title">Snapshot visibility by isolation level</title><desc id="desc">After a first read sees version 1, another session commits version 2. The next read sees version 2 at Read Committed, but keeps version 1 at Repeatable Read.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8da3b8"/></marker></defs><rect width="1000" height="570" rx="20" fill="#0d1828"/><path d="M340 87 H430" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M580 130 V235" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="595" y="190" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">then</text><path d="M430 277 H215 V445" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="230" y="395" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">new snapshot</text><path d="M730 277 H785 V445" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="800" y="395" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">same snapshot</text><rect x="40" y="45" width="300" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="190.0" y="76" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">A: transaction begins</text><text x="190.0" y="104" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">No write from B committed yet</text><rect x="430" y="45" width="300" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="580.0" y="76" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">A: first ordinary read</text><text x="580.0" y="104" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Sees version 1</text><rect x="430" y="235" width="300" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="580.0" y="266" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">B: update and commit</text><text x="580.0" y="294" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Version 2 becomes committed</text><rect x="40" y="445" width="350" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="215.0" y="476" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">A with Read Committed</text><text x="215.0" y="504" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Next statement sees version 2</text><rect x="610" y="445" width="350" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="785.0" y="476" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">A with Repeatable Read</text><text x="785.0" y="504" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Next read retains version 1</text></svg>
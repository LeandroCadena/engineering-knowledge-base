<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc"><title id="title">Commit and recovery boundaries</title><desc id="desc">With ordinary local durable commit settings, the commit WAL boundary is flushed before client acknowledgement. Table-page flushing and asynchronous replica replay can happen later.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8da3b8"/></marker></defs><rect width="1000" height="380" rx="20" fill="#0d1828"/><path d="M310 87 H390" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M660 87 H720" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M525 130 V255" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="540" y="195" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">separate timing</text><path d="M660 108 H690 V210 H840 V255" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="730" y="195" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">replication</text><path d="M390 108 H350 V210 H175 V255" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="185" y="195" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">on restart</text><rect x="40" y="45" width="270" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="175.0" y="76" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Commit request</text><text x="175.0" y="104" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">WAL includes transaction data</text><rect x="390" y="45" width="270" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="525.0" y="76" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Required WAL flush</text><text x="525.0" y="104" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Configured durable boundary</text><rect x="720" y="45" width="240" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="840.0" y="76" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Client gets success</text><text x="840.0" y="104" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Commit acknowledged</text><rect x="390" y="255" width="270" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="525.0" y="286" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Later page flushing</text><text x="525.0" y="314" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Checkpoint / background work</text><rect x="720" y="255" width="240" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="840.0" y="286" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Replica replay</text><text x="840.0" y="314" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">May lag if asynchronous</text><rect x="40" y="255" width="270" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="175.0" y="286" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Crash recovery</text><text x="175.0" y="314" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Replay durable WAL</text></svg>
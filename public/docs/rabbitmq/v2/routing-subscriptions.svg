<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><title id="title">Independent queues and competing consumers</title><desc id="desc">The same publication can route to independently bound queues. Workers on the fulfillment queue compete for deliveries while the audit subscription has its own copy.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8da3b8"/></marker></defs><rect width="1000" height="510" rx="20" fill="#0d1828"/><path d="M310 202 H350 V82 H390" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="320" y="145" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">binding</text><path d="M310 202 H350 V352 H390" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="320" y="290" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">binding</text><path d="M660 82 H720" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M525 125 V222 H720" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M660 352 H690 V422 H720" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="160" width="270" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="175.0" y="191" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Orders exchange</text><text x="175.0" y="219" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Publication + routing key</text><rect x="390" y="40" width="270" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="525.0" y="71" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Fulfillment queue</text><text x="525.0" y="99" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Competing workers</text><rect x="390" y="310" width="270" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="525.0" y="341" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Audit queue</text><text x="525.0" y="369" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Independent subscription</text><rect x="720" y="40" width="240" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="840.0" y="71" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Worker A</text><text x="840.0" y="99" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">One delivery opportunity</text><rect x="720" y="180" width="240" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="840.0" y="211" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Worker B</text><text x="840.0" y="239" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Shared queue workload</text><rect x="720" y="380" width="240" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="840.0" y="411" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Audit consumer</text><text x="840.0" y="439" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Its own queue copy</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc"><title id="title">Two acknowledgement boundaries</title><desc id="desc">Publisher confirms cover broker acceptance. Consumer acknowledgement follows the required business persistence and cannot atomically join that database effect to broker settlement.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8da3b8"/></marker></defs><rect width="1000" height="400" rx="20" fill="#0d1828"/><path d="M310 70 H390" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="320" y="25" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">publish</text><path d="M660 70 H720" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="665" y="25" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">deliver</text><path d="M525 125 V185 H175 V125" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="225" y="170" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">publisher confirm</text><path d="M840 125 V265" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M720 307 H525 V125" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="430" y="245" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">consumer ack after commit</text><rect x="40" y="40" width="270" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="175.0" y="71" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Publisher</text><text x="175.0" y="99" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Observe broker acceptance</text><rect x="390" y="40" width="270" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="525.0" y="71" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Broker queue</text><text x="525.0" y="99" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Ready / unacknowledged</text><rect x="720" y="40" width="240" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="840.0" y="71" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Consumer</text><text x="840.0" y="99" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Own delivery processing</text><rect x="720" y="265" width="240" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="840.0" y="296" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Business persistence</text><text x="840.0" y="324" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Commit required effect</text></svg>
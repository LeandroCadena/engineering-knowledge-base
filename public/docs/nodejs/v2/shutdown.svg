<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc"><title id="title">Bounded process shutdown</title><desc id="desc">Termination disables readiness and admission, drains active work until a deadline, then cleans up or escalates according to policy.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8da3b8"/></marker></defs><rect width="1000" height="550" rx="20" fill="#0d1828"/><path d="M300 82 H370" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M630 82 H700" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M830 125 V235" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M700 265 H630" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="650" y="250" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">yes</text><path d="M830 320 V365 H170 V320" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="500" y="352" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">no</text><path d="M500 320 V430" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M170 320 V470 H370" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="40" width="260" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="170.0" y="71" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">SIGTERM</text><text x="170.0" y="99" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Begin shutdown once</text><rect x="370" y="40" width="260" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="500.0" y="71" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Not ready</text><text x="500.0" y="99" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Stop new admission</text><rect x="700" y="40" width="260" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="830.0" y="71" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Drain active work</text><text x="830.0" y="99" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Await owned completions</text><rect x="700" y="235" width="260" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="830.0" y="266" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Deadline outcome</text><text x="830.0" y="294" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Did work finish in time?</text><rect x="370" y="235" width="260" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="500.0" y="266" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Completed</text><text x="500.0" y="294" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Close dependencies</text><rect x="40" y="235" width="260" height="85" rx="12" fill="#142438" stroke="#ef939d" stroke-width="2"/><text x="170.0" y="266" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Expired</text><text x="170.0" y="294" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Abort / force by policy</text><rect x="370" y="430" width="260" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="500.0" y="461" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Process exit</text><text x="500.0" y="489" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Report final status</text></svg>
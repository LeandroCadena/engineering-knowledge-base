<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc"><title id="title">Writable backpressure</title><desc id="desc">Each write accepts its chunk. A false result pauses further writes until drain, while errors follow a failure path.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8da3b8"/></marker></defs><rect width="1000" height="470" rx="20" fill="#0d1828"/><path d="M300 87 H380" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M640 87 H700" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M830 130 V235" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="846" y="187" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">false</text><path d="M700 275 H640" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="647" y="259" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">drain</text><path d="M510 235 V175 H170 V130" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="250" y="163" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">next chunk</text><path d="M830 45 V12 H170 V45" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="390" y="34" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">true: continue</text><path d="M700 300 H675 V370 H170 V320" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="300" y="355" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">error / premature close</text><rect x="40" y="45" width="260" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="170.0" y="76" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Producer</text><text x="170.0" y="104" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Next chunk available</text><rect x="380" y="45" width="260" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="510.0" y="76" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">write(chunk)</text><text x="510.0" y="104" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Chunk is accepted</text><rect x="700" y="45" width="260" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="830.0" y="76" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Return value</text><text x="830.0" y="104" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">More writes allowed?</text><rect x="700" y="235" width="260" height="85" rx="12" fill="#142438" stroke="#ef939d" stroke-width="2"/><text x="830.0" y="266" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">false: pause writes</text><text x="830.0" y="294" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Wait for drain or failure</text><rect x="380" y="235" width="260" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="510.0" y="266" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">drain event</text><text x="510.0" y="294" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Resume production</text><rect x="40" y="235" width="260" height="85" rx="12" fill="#142438" stroke="#ef939d" stroke-width="2"/><text x="170.0" y="266" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Error / close</text><text x="170.0" y="294" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Stop; handle failure</text><text x="500" y="430" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="18">A false return is not rejection. Resending the same chunk duplicates data.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc"><title id="title">Runtime resource boundaries</title><desc id="desc">Main-thread JavaScript initiates network and native-pool operations, then handles completions. Explicit workers execute JavaScript in separate isolates.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8da3b8"/></marker></defs><rect width="1000" height="570" rx="20" fill="#0d1828"/><path d="M350 85 H170 V235" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="180" y="170" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">initiate</text><path d="M500 125 V235" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="515" y="185" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">delegate</text><path d="M650 85 H830 V235" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="840" y="170" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">post message</text><path d="M170 320 V400 H420 V450" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="180" y="385" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">completion</text><path d="M500 320 V450" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="515" y="390" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">completion</text><path d="M830 320 V400 H580 V450" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="845" y="385" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">message</text><rect x="350" y="40" width="300" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="500.0" y="71" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Main JavaScript thread</text><text x="500.0" y="99" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Handlers and continuations</text><rect x="40" y="235" width="260" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="170.0" y="266" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Operating-system I/O</text><text x="170.0" y="294" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Socket readiness / completion</text><rect x="370" y="235" width="260" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="500.0" y="266" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Native worker pool</text><text x="500.0" y="294" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Files, crypto, compression</text><rect x="700" y="235" width="260" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="830.0" y="266" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">JavaScript Worker</text><text x="830.0" y="294" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Separate V8 isolate</text><rect x="350" y="450" width="300" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="500.0" y="481" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Main-thread callback</text><text x="500.0" y="509" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Runs when the thread yields</text></svg>
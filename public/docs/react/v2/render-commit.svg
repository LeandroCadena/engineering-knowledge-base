<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#91a8bd"/></marker></defs><rect width="1000" height="460" rx="20" fill="#0d1928"/><rect x="40" y="40" width="260" height="85" rx="12" fill="#17283b" stroke="#57bde9" stroke-width="2"/><text x="170.0" y="71" fill="#dfeefa" text-anchor="middle" font-family="Arial,sans-serif" font-size="21">Update queued</text><text x="170.0" y="100" fill="#b8cce0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">Props • state • context</text><rect x="370" y="40" width="270" height="85" rx="12" fill="#17283b" stroke="#b9a0f5" stroke-width="2"/><text x="505.0" y="71" fill="#dfeefa" text-anchor="middle" font-family="Arial,sans-serif" font-size="21">Render calculation</text><text x="505.0" y="100" fill="#b8cce0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">Pure component execution</text><rect x="710" y="40" width="250" height="85" rx="12" fill="#17283b" stroke="#4bddb3" stroke-width="2"/><text x="835.0" y="71" fill="#dfeefa" text-anchor="middle" font-family="Arial,sans-serif" font-size="21">Commit</text><text x="835.0" y="100" fill="#b8cce0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">Selected host changes</text><path d="M300 82 H370" fill="none" stroke="#91a8bd" stroke-width="2" marker-end="url(#arrow)"/><path d="M640 82 H710" fill="none" stroke="#91a8bd" stroke-width="2" marker-end="url(#arrow)"/><rect x="370" y="280" width="270" height="85" rx="12" fill="#17283b" stroke="#ec9ca5" stroke-width="2"/><text x="505.0" y="311" fill="#dfeefa" text-anchor="middle" font-family="Arial,sans-serif" font-size="21">Abandoned render</text><text x="505.0" y="340" fill="#b8cce0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">No committed UI changes</text><path d="M505 125 V280" fill="none" stroke="#91a8b
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1000 370"
  role="img"
  aria-label="Approval interrupts execution; resume re-enters approval and chooses publish or reject"
>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#c6a6ff" />
    </marker>
  </defs>
  <rect width="1000" height="370" rx="16" fill="#0f172a" />
  <g font-family="system-ui,sans-serif">
    <path d="M295 80H365" fill="none" stroke="#c6a6ff" stroke-width="3" marker-end="url(#a)" />
    <path d="M635 80H705" fill="none" stroke="#c6a6ff" stroke-width="3" marker-end="url(#a)" />
    <path d="M500 130V230" fill="none" stroke="#c6a6ff" stroke-width="3" marker-end="url(#a)" />
    <path
      d="M420 130V185H315L230 230"
      fill="none"
      stroke="#c6a6ff"
      stroke-width="3"
      marker-end="url(#a)"
    />
    <path
      d="M160 230V160H340V110H365"
      fill="none"
      stroke="#c6a6ff"
      stroke-width="3"
      marker-end="url(#a)"
    />
    <rect x="25" y="30" width="270" height="100" rx="12" fill="#172033" stroke="#c6a6ff" />
    <text x="160.0" y="68" text-anchor="middle" fill="#c6a6ff" font-size="23" font-weight="600">
      Prepare
    </text>
    <text x="160.0" y="104" text-anchor="middle" fill="#e2e8f0" font-size="19">Completed node</text>
    <rect x="365" y="30" width="270" height="100" rx="12" fill="#172033" stroke="#c6a6ff" />
    <text x="500.0" y="68" text-anchor="middle" fill="#c6a6ff" font-size="23" font-weight="600">
      Approval node
    </text>
    <text x="500.0" y="104" text-anchor="middle" fill="#e2e8f0" font-size="19">
      interrupt → re-entry
    </text>
    <rect x="705" y="30" width="270" height="100" rx="12" fill="#172033" stroke="#c6a6ff" />
    <text x="840.0" y="68" text-anchor="middle" fill="#c6a6ff" font-size="23" font-weight="600">
      Publish
    </text>
    <text x="840.0" y="104" text-anchor="middle" fill="#e2e8f0" font-size="19">
      Boolean approval only
    </text>
    <rect x="25" y="230" width="270" height="100" rx="12" fill="#172033" stroke="#c6a6ff" />
    <text x="160.0" y="268" text-anchor="middle" fill="#c6a6ff" font-size="23" font-weight="600">
      Checkpoint
    </text>
    <text x="160.0" y="304" text-anchor="middle" fill="#e2e8f0" font-size="19">
      State + pending node
    </text>
    <rect x="365" y="230" width="270" height="100" rx="12" fill="#172033" stroke="#c6a6ff" />
    <text x="500.0" y="268" text-anchor="middle" fill="#c6a6ff" font-size="23" font-weight="600">
      Reject
    </text>
    <text x="500.0" y="304" text-anchor="middle" fill="#e2e8f0" font-size="19">No publication</text>
  </g>
</svg>

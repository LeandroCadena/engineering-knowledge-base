<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">Express error boundaries</title><desc id="desc">Synchronous throws and returned-promise rejections enter error dispatch. Detached work needs its own handling.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8da3b8"/></marker></defs><rect width="1000" height="500" rx="20" fill="#0d1828"/><path d="M310 80 H350 V145 H400" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M310 220 H350 V145" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M630 145 H710" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M835 185 V265" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="849" y="231" fill="#a7bbd0" font-family="Arial,sans-serif" font-size="17">no</text><path d="M710 165 H670 V305 H630" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="647" y="245" fill="#a7bbd0" font-family="Arial,sans-serif" font-size="17">yes</text><rect x="40" y="40" width="270" height="80" rx="12" fill="#142438" stroke="#5ba9d9" stroke-width="2"/><text x="175.0" y="70" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Synchronous throw</text><text x="175.0" y="97" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Inside invoked handler</text><rect x="40" y="180" width="270" height="80" rx="12" fill="#142438" stroke="#5ba9d9" stroke-width="2"/><text x="175.0" y="210" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Promise rejection</text><text x="175.0" y="237" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Returned or awaited</text><rect x="400" y="105" width="230" height="80" rx="12" fill="#142438" stroke="#eb9191" stroke-width="2"/><text x="515.0" y="135" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Error middleware</text><text x="515.0" y="162" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Four parameters</text><rect x="710" y="105" width="250" height="80" rx="12" fill="#142438" stroke="#5ba9d9" stroke-width="2"/><text x="835.0" y="135" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Headers sent?</text><text x="835.0" y="162" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Choose response path</text><rect x="710" y="265" width="250" height="80" rx="12" fill="#142438" stroke="#5ecdb0" stroke-width="2"/><text x="835.0" y="295" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">No: JSON error</text><text x="835.0" y="322" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Set status and body</text><rect x="400" y="265" width="230" height="80" rx="12" fill="#142438" stroke="#eb9191" stroke-width="2"/><text x="515.0" y="295" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Yes: next(error)</text><text x="515.0" y="322" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Delegate; may close</text><rect x="40" y="385" width="920" height="80" rx="12" fill="#142438" stroke="#eb9191" stroke-width="2"/><text x="500.0" y="415" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Detached timers, events and background jobs</text><text x="500.0" y="442" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Handle errors explicitly; they are outside the returned promise.</text></svg>
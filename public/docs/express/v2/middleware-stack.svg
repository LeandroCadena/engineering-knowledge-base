<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">Ordered Express middleware</title><desc id="desc">Normal traversal follows registration order; a response ends traversal and next(error) enters error middleware.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8da3b8"/></marker></defs><rect width="1000" height="500" rx="20" fill="#0d1828"/><path d="M290 85 H375" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="315" y="69" fill="#a7bbd0" font-family="Arial,sans-serif" font-size="17">next()</text><path d="M625 85 H710" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="650" y="69" fill="#a7bbd0" font-family="Arial,sans-serif" font-size="17">next()</text><path d="M835 125 V230" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="850" y="184" fill="#a7bbd0" font-family="Arial,sans-serif" font-size="17">send</text><path d="M500 125 V390" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="510" y="285" fill="#a7bbd0" font-family="Arial,sans-serif" font-size="17">parse error</text><path d="M835 125 V170 H655 V430 H625" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="675" y="365" fill="#a7bbd0" font-family="Arial,sans-serif" font-size="17">next(error)</text><path d="M710 105 H675 V205 H165 V230" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="320" y="195" fill="#a7bbd0" font-family="Arial,sans-serif" font-size="17">no handler responds</text><path d="M165 310 V350 H500 V390" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="270" y="338" fill="#a7bbd0" font-family="Arial,sans-serif" font-size="17">send 404</text><rect x="40" y="45" width="250" height="80" rx="12" fill="#142438" stroke="#5ba9d9" stroke-width="2"/><text x="165.0" y="75" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Request ID</text><text x="165.0" y="102" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Attach response state</text><rect x="375" y="45" width="250" height="80" rx="12" fill="#142438" stroke="#5ba9d9" stroke-width="2"/><text x="500.0" y="75" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">JSON parser</text><text x="500.0" y="102" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Parse matching bodies</text><rect x="710" y="45" width="250" height="80" rx="12" fill="#142438" stroke="#5ba9d9" stroke-width="2"/><text x="835.0" y="75" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Orders router</text><text x="835.0" y="102" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Match method and path</text><rect x="710" y="230" width="250" height="80" rx="12" fill="#142438" stroke="#5ecdb0" stroke-width="2"/><text x="835.0" y="260" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Response</text><text x="835.0" y="287" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Complete this request</text><rect x="375" y="390" width="250" height="80" rx="12" fill="#142438" stroke="#eb9191" stroke-width="2"/><text x="500.0" y="420" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Error middleware</text><text x="500.0" y="447" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Map a public response</text><rect x="40" y="230" width="250" height="80" rx="12" fill="#142438" stroke="#5ba9d9" stroke-width="2"/><text x="165.0" y="260" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">404 fallback</text><text x="165.0" y="287" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Normal stack exhausted</text></svg>
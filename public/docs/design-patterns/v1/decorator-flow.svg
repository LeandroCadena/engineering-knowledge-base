<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#91a8bd"/></marker></defs><rect width="1000" height="410" rx="20" fill="#0d1928"/><rect x="40" y="40" width="270" height="85" rx="12" fill="#17283b" stroke="#57bde9" stroke-width="2"/><text x="175.0" y="71" fill="#dfeefa" text-anchor="middle" font-family="Arial,sans-serif" font-size="21">Notifier</text><text x="175.0" y="100" fill="#b8cce0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">Uses Sender.send</text><rect x="390" y="40" width="240" height="85" rx="12" fill="#17283b" stroke="#b9a0f5" stroke-width="2"/><text x="510.0" y="71" fill="#dfeefa" text-anchor="middle" font-family="Arial,sans-serif" font-size="21">Observed sender</text><text x="510.0" y="100" fill="#b8cce0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">Same contract</text><rect x="710" y="40" width="250" height="85" rx="12" fill="#17283b" stroke="#4bddb3" stroke-width="2"/><text x="835.0" y="71" fill="#dfeefa" text-anchor="middle" font-family="Arial,sans-serif" font-size="21">Provider adapter</text><text x="835.0" y="100" fill="#b8cce0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">One inner send</text><path d="M310 82 H390" fill="none" stroke="#91a8bd" stroke-width="2" marker-end="url(#arrow)"/><path d="M630 82 H710" fill="none" stroke="#91a8bd" stroke-width="2" marker-end="url(#arrow)"/><rect x="390" y="260" width="240" height="85" rx="12" fill="#17283b" stroke="#57bde9" stroke-width="2"/><text x="510.0" y="291" fill="#dfeefa" text-anchor="middle" font-family="Arial,sans-serif" font-size="21">Metric recorder</text><text x="510.0" y="320" fill="#b8cce0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">Best-effort outcome</text><path d="M510 125 V260" fill="none" stroke="#91a8bd" stroke-width="2" marker-end="url(#arrow)"/><text x="820" y="285" fill="#dfeefa" text-anchor="middle" font-family="Arial,sans-serif" font-size="18">Result / original error</text><text x="820" y="320" fill="#dfeefa" text-anchor="middle" font-family="Arial,sans-serif" font-size="18">preserved for caller</text><text x="175" y="285" fill="#dfeefa" text-anchor="middle" font-family="Arial,sans-serif" font-size="18">Metrics failure</text><text x="175" y="320" fill="#dfeefa" text-anchor="middle" font-family="Arial,sans-serif" font-size="18">does not resend</text></svg>
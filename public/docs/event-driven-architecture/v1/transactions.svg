<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#94abc0"/></marker></defs><rect width="1000" height="470" rx="20" fill="#0d1928"/><rect x="30" y="30" width="440" height="315" rx="16" fill="none" stroke="#4bddb3" stroke-dasharray="7 6"/><rect x="530" y="30" width="440" height="315" rx="16" fill="none" stroke="#4bddb3" stroke-dasharray="7 6"/><text x="250" y="65" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#dceaf7">Producer transaction</text><text x="750" y="65" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#dceaf7">Consumer transaction</text><rect x="70" y="100" width="360" height="80" rx="12" fill="#17283b" stroke="#b9a0f5" stroke-width="2"/><text x="250.0" y="131" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#dceaf7">Order state</text><text x="250.0" y="158" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#dceaf7">Confirmed + agreed total</text><rect x="70" y="220" width="360" height="80" rx="12" fill="#17283b" stroke="#4bddb3" stroke-width="2"/><text x="250.0" y="251" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#dceaf7">Outbox intent</text><text x="250.0" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#dceaf7">Stable event ID + payload</text><rect x="570" y="100" width="360" height="80" rx="12" fill="#17283b" stroke="#4bddb3" stroke-width="2"/><text x="750.0" y="131" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#dceaf7">Inbox identity</text><text x="750.0" y="158" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#dceaf7">Consumer + event ID</text><rect x="570" y="220" width="360" height="80" rx="12" fill="#17283b" stroke="#b9a0f5" stroke-width="2"/><text x="750.0" y="251" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#dceaf7">Sales projection</text><text x="750.0" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#dceaf7">Count + USD total</text><path d="M250 180 V220" fill="none" stroke="#94abc0" stroke-width="2" marker-end="url(#arrow)"/><path d="M750 180 V220" fill="none" stroke="#94abc0" stroke-width="2" marker-end="url(#arrow)"/><path d="M430 260 H510 V140 H570" fill="none" stroke="#94abc0" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="500" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#dceaf7">Relay may publish the same event again.</text><text x="500" y="425" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#dceaf7">Inbox and projection commit together before successful processing is acknowledged.</text></svg>
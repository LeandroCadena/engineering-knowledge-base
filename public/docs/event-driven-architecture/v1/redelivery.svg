<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#94abc0"/></marker></defs><rect width="1000" height="390" rx="20" fill="#0d1928"/><rect x="40" y="45" width="260" height="80" rx="12" fill="#17283b" stroke="#b9a0f5" stroke-width="2"/><text x="170.0" y="76" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#dceaf7">Relay</text><text x="170.0" y="103" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#dceaf7">Stored event E</text><rect x="700" y="45" width="260" height="80" rx="12" fill="#17283b" stroke="#4bddb3" stroke-width="2"/><text x="830.0" y="76" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#dceaf7">Transport</text><text x="830.0" y="103" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#dceaf7">Accept E</text><path d="M300 85 H700" fill="none" stroke="#94abc0" stroke-width="2" marker-end="url(#arrow)"/><text x="500" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#dceaf7">Publish E</text><path d="M700 120H520" stroke="#f19db3" stroke-dasharray="6 6" stroke-width="2"/><text x="500" y="164" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#f19db3">Acknowledgment lost</text><rect x="40" y="250" width="260" height="80" rx="12" fill="#17283b" stroke="#b9a0f5" stroke-width="2"/><text x="170.0" y="281" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#dceaf7">Relay retry</text><text x="170.0" y="308" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#dceaf7">Same event E</text><rect x="700" y="250" width="260" height="80" rx="12" fill="#17283b" stroke="#57bde9" stroke-width="2"/><text x="830.0" y="281" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#dceaf7">Consumer inbox</text><text x="830.0" y="308" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#dceaf7">Apply E once</text><path d="M170 125 V250" fill="none" stroke="#94abc0" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 290 H700" fill="none" stroke="#94abc0" stroke-width="2" marker-end="url(#arrow)"/><text x="500" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#dceaf7">Repeated delivery</text><text x="500" y="365" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#dceaf7">Acceptance and a received acknowledgment are different observations.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc"><title id="title">Request context and output ownership</title><desc id="desc">Request child: Bound request ID. Async context: Logger during work. Worker transport: Destination lifecycle</desc><rect width="1000" height="340" rx="20" fill="#111827"/><text x="38" y="57" fill="#f3f4f6" font-family="sans-serif" font-size="28">Request context and output ownership</text><rect x="38" y="105" width="288" height="150" rx="12" fill="#1f2937" stroke="#82cf9a"/><text x="56" y="151" fill="#82cf9a" font-family="sans-serif" font-size="22">Request child</text><text x="56" y="194" fill="#e5e7eb" font-family="sans-serif" font-size="19">Bound request ID</text><rect x="356" y="105" width="288" height="150" rx="12" fill="#1f2937" stroke="#82cf9a"/><text x="374" y="151" fill="#82cf9a" font-family="sans-serif" font-size="22">Async context</text><text x="374" y="194" fill="#e5e7eb" font-family="sans-serif" font-size="19">Logger during work</text><rect x="674" y="105" width="288" height="150" rx="12" fill="#1f2937" stroke="#82cf9a"/><text x="692" y="151" fill="#82cf9a" font-family="sans-serif" font-size="22">Worker transport</text><text x="692" y="194" fill="#e5e7eb" font-family="sans-serif" font-size="19">Destination lifecycle</text><text x="38" y="305" fill="#9ca3af" font-family="sans-serif" font-size="18">Context isolation and output delivery require separate checks.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" role="img" aria-labelledby="title desc"><title id="title">Authorization code and PKCE channels</title><desc id="desc">Browser redirects carry the authorization request and callback. The client validates its pending transaction, then directly exchanges the code and verifier at the authorization server.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8da3b8"/></marker></defs><rect width="1000" height="690" rx="20" fill="#0d1828"/><rect x="25" y="25" width="270" height="60" rx="10" fill="#142438" stroke="#65b4e4"/><text x="160" y="62" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">OAuth client</text><path d="M160 85 V660" stroke="#40566b" stroke-dasharray="7 7"/><rect x="365" y="25" width="270" height="60" rx="10" fill="#142438" stroke="#65b4e4"/><text x="500" y="62" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Browser</text><path d="M500 85 V660" stroke="#40566b" stroke-dasharray="7 7"/><rect x="705" y="25" width="270" height="60" rx="10" fill="#142438" stroke="#65b4e4"/><text x="840" y="62" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Authorization server</text><path d="M840 85 V660" stroke="#40566b" stroke-dasharray="7 7"/><text x="180" y="132" fill="#b7a0f0" font-family="Arial,sans-serif" font-size="18">Store session-bound state + verifier</text><path d="M160 180 H500" stroke="#8da3b8" stroke-width="2" marker-end="url(#a)"/><text x="330.0" y="168" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="18">Redirect to authorization</text><path d="M500 255 H840" stroke="#8da3b8" stroke-width="2" marker-end="url(#a)"/><text x="670.0" y="243" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="18">State + S256 challenge</text><text x="840" y="305" text-anchor="middle" fill="#b7a0f0" font-family="Arial,sans-serif" font-size="18">Owner authorization</text><path d="M840 360 H500" stroke="#8da3b8" stroke-width="2" marker-end="url(#a)"/><text x="670.0" y="348" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="18">Redirect: code + state + issuer</text><path d="M500 435 H160" stroke="#8da3b8" stroke-width="2" marker-end="url(#a)"/><text x="330.0" y="423" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="18">Callback to registered URI</text><text x="180" y="480" fill="#b7a0f0" font-family="Arial,sans-serif" font-size="18">Validate and consume transaction</text><path d="M160 550 H840" stroke="#8da3b8" stroke-width="2" marker-end="url(#a)"/><text x="500.0" y="538" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="18">Direct token request: code + verifier (+ client authentication)</text><path d="M840 635 H160" stroke="#8da3b8" stroke-width="2" marker-end="url(#a)"/><text x="500.0" y="623" text-anchor="middle" fill="#5ed1ad" font-family="Arial,sans-serif" font-size="18">Token response over protected connection</text></svg>
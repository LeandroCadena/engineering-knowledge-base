<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370" role="img" aria-labelledby="title desc"><title id="title">Refresh rotation and family revocation</title><desc id="desc">A refresh token is consumed when its successor is issued. Reuse of that predecessor revokes the related family. The API only observes this immediately if it checks revocation state.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8da3b8"/></marker></defs><rect width="1000" height="370" rx="20" fill="#0d1828"/><path d="M310 82 H390" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M660 82 H720" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M175 125 V240" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="190" y="190" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">replay</text><path d="M310 282 H390" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M660 282 H720" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="40" width="270" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="175.0" y="71" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Refresh R1</text><text x="175.0" y="99" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Active family F</text><rect x="390" y="40" width="270" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="525.0" y="71" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Rotation</text><text x="525.0" y="99" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Consume R1; issue R2</text><rect x="720" y="40" width="240" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="840.0" y="71" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Refresh R2</text><text x="840.0" y="99" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Active family F</text><rect x="40" y="240" width="270" height="85" rx="12" fill="#142438" stroke="#ef939d" stroke-width="2"/><text x="175.0" y="271" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">R1 used again</text><text x="175.0" y="299" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Consumed predecessor</text><rect x="390" y="240" width="270" height="85" rx="12" fill="#142438" stroke="#ef939d" stroke-width="2"/><text x="525.0" y="271" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Revoke family F</text><text x="525.0" y="299" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Reject further refreshes</text><rect x="720" y="240" width="240" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="840.0" y="271" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Resource API</text><text x="840.0" y="299" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">State check or expiry</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc"><title id="title">Pending delivery and recovery</title><desc id="desc">Delivery creates pending state. A committed effect followed by a crash before acknowledgment can be reclaimed and processed again.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8da3b8"/></marker></defs><rect width="1000" height="570" rx="20" fill="#0d1828"/><path d="M310 87 H390" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M660 87 H720" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="665" y="70" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">normal</text><path d="M525 130 V245" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="540" y="190" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">failure path</text><path d="M390 287 H175 V445" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="185" y="390" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">idle threshold</text><path d="M310 487 H390" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M660 487 H720" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="45" width="270" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="175.0" y="76" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Group delivery</text><text x="175.0" y="104" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Entry becomes pending</text><rect x="390" y="45" width="270" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="525.0" y="76" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Business effect</text><text x="525.0" y="104" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Commits in its state owner</text><rect x="720" y="45" width="240" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="840.0" y="76" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">XACK</text><text x="840.0" y="104" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Remove pending state</text><rect x="390" y="245" width="270" height="85" rx="12" fill="#142438" stroke="#ef939d" stroke-width="2"/><text x="525.0" y="276" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Crash before XACK</text><text x="525.0" y="304" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Entry remains pending</text><rect x="40" y="445" width="270" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="175.0" y="476" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">XAUTOCLAIM</text><text x="175.0" y="504" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Transfer idle pending entry</text><rect x="390" y="445" width="270" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="525.0" y="476" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Recovery consumer</text><text x="525.0" y="504" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Deduplicate / repeat effect</text><rect x="720" y="445" width="240" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="840.0" y="476" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">XACK after completion</text><text x="840.0" y="504" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Entry can remain in stream</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="455" viewBox="0 0 1000 455" role="img" aria-labelledby="title desc"><title id="title">Lease expiry and stale owners</title><desc id="desc">Owner A pauses until its lease expires. Owner B obtains a new token. A cannot release B&#x27;s lease, but an unfenced external effect can still be attempted.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8da3b8"/></marker></defs><rect width="1000" height="455" rx="20" fill="#0d1828"/><path d="M310 87 H390" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M660 87 H720" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M840 130 V200 H175 V280" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="390" y="185" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">after expiry and reacquisition</text><path d="M310 322 H390" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="320" y="306" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">release</text><path d="M175 365 V420 H840 V365" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="405" y="405" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">separate effect path</text><rect x="40" y="45" width="270" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="175.0" y="76" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">A acquires token A</text><text x="175.0" y="104" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">SET NX PX; then pauses</text><rect x="390" y="45" width="270" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="525.0" y="76" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Lease expires</text><text x="525.0" y="104" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Key becomes available</text><rect x="720" y="45" width="240" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="840.0" y="76" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">B acquires token B</text><text x="840.0" y="104" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">B now owns the lease</text><rect x="40" y="280" width="270" height="85" rx="12" fill="#142438" stroke="#ef939d" stroke-width="2"/><text x="175.0" y="311" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">A resumes late</text><text x="175.0" y="339" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Its old lease is invalid</text><rect x="390" y="280" width="270" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="525.0" y="311" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">A: release token A</text><text x="525.0" y="339" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Compare-and-delete returns 0</text><rect x="720" y="280" width="240" height="85" rx="12" fill="#142438" stroke="#ef939d" stroke-width="2"/><text x="840.0" y="311" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">A: external write</text><text x="840.0" y="339" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Needs target-side fencing</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc"><title id="title">Stale cache repopulation</title><desc id="desc">An earlier miss reads version 1. Another request commits version 2 and deletes the cache. The earlier reader can then cache version 1 after that deletion.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8da3b8"/></marker></defs><rect width="1000" height="410" rx="20" fill="#0d1828"/><path d="M310 87 H390" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="325" y="70" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">then</text><path d="M660 87 H720" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M840 130 V210 H175 V285" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="390" y="195" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">A resumes after deletion</text><path d="M310 327 H390" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M660 327 H720" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="45" width="270" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="175.0" y="76" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Reader A: cache miss</text><text x="175.0" y="104" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Reads database version 1</text><rect x="390" y="45" width="270" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="525.0" y="76" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Writer B: commit</text><text x="525.0" y="104" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Database now holds version 2</text><rect x="720" y="45" width="240" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="840.0" y="76" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Writer B: invalidate</text><text x="840.0" y="104" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">DEL cached order</text><rect x="40" y="285" width="270" height="85" rx="12" fill="#142438" stroke="#ef939d" stroke-width="2"/><text x="175.0" y="316" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Reader A: resumes</text><text x="175.0" y="344" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Still holds its old snapshot</text><rect x="390" y="285" width="270" height="85" rx="12" fill="#142438" stroke="#ef939d" stroke-width="2"/><text x="525.0" y="316" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Reader A: cache fill</text><text x="525.0" y="344" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">SET version 1 with a TTL</text><rect x="720" y="285" width="240" height="85" rx="12" fill="#142438" stroke="#ef939d" stroke-width="2"/><text x="840.0" y="316" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Next reader: cache hit</text><text x="840.0" y="344" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Can receive stale version 1</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#91a8bd"/></marker></defs><rect width="1000" height="500" rx="20" fill="#0d1928"/><rect x="40" y="40" width="260" height="85" rx="12" fill="#17283b" stroke="#57bde9" stroke-width="2"/><text x="170.0" y="71" fill="#dfeefa" text-anchor="middle" font-family="Arial,sans-serif" font-size="21">SQS standard queue</text><text x="170.0" y="100" fill="#b8cce0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">Messages A and B</text><rect x="370" y="40" width="260" height="85" rx="12" fill="#17283b" stroke="#b9a0f5" stroke-width="2"/><text x="500.0" y="71" fill="#dfeefa" text-anchor="middle" font-family="Arial,sans-serif" font-size="21">Lambda batch</text><text x="500.0" y="100" fill="#b8cce0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">A succeeds • B fails</text><rect x="700" y="40" width="260" height="85" rx="12" fill="#17283b" stroke="#4bddb3" stroke-width="2"/><text x="830.0" y="71" fill="#dfeefa" text-anchor="middle" font-family="Arial,sans-serif" font-size="21">DynamoDB</text><text x="830.0" y="100" fill="#b8cce0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">A inserted conditionally</text><path d="M300 82 H370" fill="none" stroke="#91a8bd" stroke-width="2" marker-end="url(#arrow)"/><path d="M630 82 H700" fill="none" stroke="#91a8bd" stroke-width="2" marker-end="url(#arrow)"/><rect x="370" y="260" width="260" height="85" rx="12" fill="#17283b" stroke="#b9a0f5" stroke-width="2"/><text x="500.0" y="291" fill="#dfeefa" text-anchor="middle" font-family="Arial,sans-serif" font-size="21">Partial response</text><text x="500.0" y="320" fill="#b8cce0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">Failed message ID: B</text><path d="M500 125 V260" fill="none" stroke="#91a8bd" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="260" width="260" height="85" rx="12" fill="#17283b" stroke="#57bde9" stroke-width="2"/><text x="170.0" y="291" fill="#dfeefa" text-anchor="middle" font-family="Arial,sans-serif" font-size="21">Mapping settles A</text><text x="170.0" y="320" fill="#b8cce0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">B remains retryable</text><path d="M370 302 H300" fill="none" stroke="#91a8bd" stroke-width="2" marker-end="url(#arrow)"/><text x="500" y="405" fill="#dfeefa" text-anchor="middle" font-family="Arial,sans-serif" font-size="18">A may still be redelivered after an ambiguous acknowledgement</text><text x="500" y="443" fill="#dfeefa" text-anchor="middle" font-family="Arial,sans-serif" font-size="18">Conditional storage resolves repeats by the stable command ID</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#91a8bd"/></marker></defs><rect width="1000" height="450" rx="20" fill="#0d1928"/><text x="155" y="35" fill="#dfeefa" text-anchor="middle" font-family="Arial,sans-serif" font-size="18">Environment A</text><rect x="40" y="65" width="240" height="85" rx="12" fill="#17283b" stroke="#57bde9" stroke-width="2"/><text x="160.0" y="96" fill="#dfeefa" text-anchor="middle" font-family="Arial,sans-serif" font-size="21">Init</text><text x="160.0" y="125" fill="#b8cce0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">Module-level setup</text><rect x="380" y="65" width="240" height="85" rx="12" fill="#17283b" stroke="#b9a0f5" stroke-width="2"/><text x="500.0" y="96" fill="#dfeefa" text-anchor="middle" font-family="Arial,sans-serif" font-size="21">Invoke 1</text><text x="500.0" y="125" fill="#b8cce0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">Request-local state</text><rect x="720" y="65" width="240" height="85" rx="12" fill="#17283b" stroke="#4bddb3" stroke-width="2"/><text x="840.0" y="96" fill="#dfeefa" text-anchor="middle" font-family="Arial,sans-serif" font-size="21">Invoke 2</text><text x="840.0" y="125" fill="#b8cce0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">Reuse is optional</text><path d="M280 107 H380" fill="none" stroke="#91a8bd" stroke-width="2" marker-end="url(#arrow)"/><path d="M620 107 H720" fill="none" stroke="#91a8bd" stroke-width="2" marker-end="url(#arrow)"/><text x="155" y="245" fill="#dfeefa" text-anchor="middle" font-family="Arial,sans-serif" font-size="18">Environment B</text><rect x="40" y="275" width="240" height="85" rx="12" fill="#17283b" stroke="#57bde9" stroke-width="2"/><text x="160.0" y="306" fill="#dfeefa" text-anchor="middle" font-family="Arial,sans-serif" font-size="21">Init</text><text x="160.0" y="335" fill="#b8cce0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">Separate module state</text><rect x="380" y="275" width="240" height="85" rx="12" fill="#17283b" stroke="#b9a0f5" stroke-width="2"/><text x="500.0" y="306" fill="#dfeefa" text-anchor="middle" font-family="Arial,sans-serif" font-size="21">Invoke 3</text><text x="500.0" y="335" fill="#b8cce0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">Can overlap A</text><path d="M280 317 H380" fill="none" stroke="#91a8bd" stroke-width="2" marker-end="url(#arrow)"/><text x="785" y="305" fill="#dfeefa" text-anchor="middle" font-family="Arial,sans-serif" font-size="18">No shared memory</text><text x="785" y="340" fill="#dfeefa" text-anchor="middle" font-family="Arial,sans-serif" font-size="18">between environments</text></svg>
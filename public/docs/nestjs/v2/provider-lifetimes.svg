<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="575" viewBox="0 0 1000 575" role="img" aria-labelledby="title desc">
<title id="title">Provider lifetimes</title><desc id="desc">Default providers share an instance per registration and context; request providers differ by request; transient providers differ by consumer.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#6ee7b7"/></marker><marker id="error" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#fda4af"/></marker></defs>
<rect width="1000" height="575" rx="20" fill="#101217"/>
<style>text{font-family:system-ui,sans-serif;fill:#e4e4e7;font-size:20px}.small{font-size:17px;fill:#a1a1aa}.label{fill:#6ee7b7;font-size:18px}.error{fill:#fda4af;font-size:17px}.box{fill:#191e25;stroke:#49515d;stroke-width:1.5}.line{fill:none;stroke:#6ee7b7;stroke-width:2;marker-end:url(#arrow)}.fail{fill:none;stroke:#fda4af;stroke-width:2;marker-end:url(#error)}</style>
<text x="35" y="65" class="label">DEFAULT</text><rect x="250" y="30" width="210" height="65" rx="10" class="box"/><text x="355.0" y="62" text-anchor="middle">Request A</text><rect x="250" y="105" width="210" height="65" rx="10" class="box"/><text x="355.0" y="137" text-anchor="middle">Request B</text><rect x="680" y="65" width="270" height="75" rx="10" class="box"/><text x="815.0" y="97" text-anchor="middle">Shared provider</text><path d="M460 62 H570 V102 H680" class="line"/><path d="M460 137 H570 V102" class="line"/><path d="M30 195 H970" stroke="#30343b"/><text x="35" y="250" class="label">REQUEST</text><rect x="250" y="215" width="210" height="65" rx="10" class="box"/><text x="355.0" y="247" text-anchor="middle">Request A</text><rect x="250" y="290" width="210" height="65" rx="10" class="box"/><text x="355.0" y="322" text-anchor="middle">Request B</text><rect x="680" y="215" width="270" height="65" rx="10" class="box"/><text x="815.0" y="247" text-anchor="middle">Instance A</text><rect x="680" y="290" width="270" height="65" rx="10" class="box"/><text x="815.0" y="322" text-anchor="middle">Instance B</text><path d="M460 247 H680" class="line"/><path d="M460 322 H680" class="line"/><path d="M30 380 H970" stroke="#30343b"/><text x="35" y="430" class="label">TRANSIENT</text><rect x="250" y="400" width="210" height="60" rx="10" class="box"/><text x="355.0" y="432" text-anchor="middle">Consumer A</text><rect x="680" y="400" width="270" height="60" rx="10" class="box"/><text x="815.0" y="432" text-anchor="middle">Its own instance</text><path d="M460 430 H680" class="line"/><rect x="250" y="475" width="210" height="60" rx="10" class="box"/><text x="355.0" y="507" text-anchor="middle">Consumer B</text><rect x="680" y="475" width="270" height="60" rx="10" class="box"/><text x="815.0" y="507" text-anchor="middle">Another instance</text><path d="M460 505 H680" class="line"/></svg>
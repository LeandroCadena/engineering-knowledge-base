<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc">
<title id="title">HTTP request success and failure paths</title><desc id="desc">Middleware runs before guards and interceptors. Interceptors wrap pipes and handler execution. A guard denial skips those downstream stages. Uncaught errors enter exception handling.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#6ee7b7"/></marker><marker id="error" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#fda4af"/></marker></defs>
<rect width="1000" height="610" rx="20" fill="#101217"/>
<style>text{font-family:system-ui,sans-serif;fill:#e4e4e7;font-size:20px}.small{font-size:17px;fill:#a1a1aa}.label{fill:#6ee7b7;font-size:18px}.error{fill:#fda4af;font-size:17px}.box{fill:#191e25;stroke:#49515d;stroke-width:1.5}.line{fill:none;stroke:#6ee7b7;stroke-width:2;marker-end:url(#arrow)}.fail{fill:none;stroke:#fda4af;stroke-width:2;marker-end:url(#error)}</style>
<rect x="35" y="45" width="250" height="75" rx="10" class="box"/><text x="160.0" y="77" text-anchor="middle">Middleware</text><path d="M285 82 H365" class="line"/><rect x="365" y="45" width="250" height="75" rx="10" class="box"/><text x="490.0" y="77" text-anchor="middle">Guards</text><path d="M615 82 H705" class="line"/><rect x="705" y="45" width="250" height="75" rx="10" class="box"/><text x="830.0" y="77" text-anchor="middle">Interceptors</text><text x="830.0" y="102" text-anchor="middle" class="small">enter</text><path d="M830 120 V180 H490 V220" class="line"/><rect x="365" y="220" width="250" height="75" rx="10" class="box"/><text x="490.0" y="252" text-anchor="middle">Pipes</text><path d="M615 257 H705" class="line"/><rect x="705" y="220" width="250" height="75" rx="10" class="box"/><text x="830.0" y="252" text-anchor="middle">Handler</text><text x="830.0" y="277" text-anchor="middle" class="small">controller → service</text><path d="M830 295 V370" class="line"/><rect x="705" y="370" width="250" height="75" rx="10" class="box"/><text x="830.0" y="402" text-anchor="middle">Interceptors</text><text x="830.0" y="427" text-anchor="middle" class="small">unwind in reverse order</text><path d="M705 407 H615" class="line"/><rect x="365" y="370" width="250" height="75" rx="10" class="box"/><text x="490.0" y="402" text-anchor="middle">Success response</text><path d="M490 120 V165 H145 V490" class="fail"/><text x="150" y="153" class="error">denied</text><path d="M365 257 H145 V490" class="fail"/><path d="M955 257 H980 V532 H330" class="fail"/><rect x="35" y="495" width="295" height="75" rx="10" class="box"/><text x="182.5" y="527" text-anchor="middle">Exception handling</text><text x="182.5" y="552" text-anchor="middle" class="small">uncaught failures only</text><text x="45" y="340" class="error">Invalid arguments:</text><text x="45" y="365" class="small">handler never executes</text></svg>
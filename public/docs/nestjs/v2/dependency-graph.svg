<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" role="img" aria-labelledby="title desc">
<title id="title">Module ownership and dependency resolution</title><desc id="desc">OrdersModule owns its controller, service, and repository adapter. AppModule imports OrdersModule; only OrdersService is exported.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#6ee7b7"/></marker><marker id="error" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#fda4af"/></marker></defs>
<rect width="1000" height="490" rx="20" fill="#101217"/>
<style>text{font-family:system-ui,sans-serif;fill:#e4e4e7;font-size:20px}.small{font-size:17px;fill:#a1a1aa}.label{fill:#6ee7b7;font-size:18px}.error{fill:#fda4af;font-size:17px}.box{fill:#191e25;stroke:#49515d;stroke-width:1.5}.line{fill:none;stroke:#6ee7b7;stroke-width:2;marker-end:url(#arrow)}.fail{fill:none;stroke:#fda4af;stroke-width:2;marker-end:url(#error)}</style>
<rect x="40" y="35" width="230" height="75" rx="10" class="box"/><text x="155.0" y="67" text-anchor="middle">AppModule</text><path d="M270 73 H350" class="line"/><text x="307" y="55" text-anchor="middle" class="small">imports</text><rect x="350" y="25" width="610" height="425" rx="14" fill="#111b1b" stroke="#347364"/><text x="380" y="62" class="label">OrdersModule</text><rect x="395" y="95" width="510" height="70" rx="10" class="box"/><text x="650.0" y="127" text-anchor="middle">OrdersController</text><path d="M650 165 V210" class="line"/><rect x="395" y="210" width="510" height="70" rx="10" class="box"/><text x="650.0" y="242" text-anchor="middle">OrdersService</text><path d="M650 280 V330" class="line"/><text x="670" y="310" class="small">ORDERS_REPOSITORY token</text><rect x="395" y="330" width="510" height="75" rx="10" class="box"/><text x="650.0" y="362" text-anchor="middle">InMemoryOrdersRepository</text><path d="M395 245 H275 V345 H120" class="line"/><text x="75" y="380" class="label">Public export</text><text x="75" y="410" class="small">OrdersService only</text></svg>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1000 420"
  role="img"
  aria-label="Proposals pass deterministic policy; writes require a bound grant, otherwise execution pauses"
>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#c6a6ff" />
    </marker>
  </defs>
  <rect width="1000" height="420" rx="16" fill="#0f172a" />
  <g font-family="system-ui,sans-serif">
    <path d="M295 80H365" fill="none" stroke="#c6a6ff" stroke-width="3" marker-end="url(#a)" />
    <path d="M635 80H705" fill="none" stroke="#c6a6ff" stroke-width="3" marker-end="url(#a)" />
    <path d="M840 130V230" fill="none" stroke="#c6a6ff" stroke-width="3" marker-end="url(#a)" />
    <path d="M750 130 560 230" fill="none" stroke="#c6a6ff" stroke-width="3" marker-end="url(#a)" />
    <path
      d="M705 280H660V385H160V330"
      fill="none"
      stroke="#c6a6ff"
      stroke-width="3"
      marker-end="url(#a)"
    />
    <path d="M160 230V130" fill="none" stroke="#c6a6ff" stroke-width="3" marker-end="url(#a)" />
    <rect x="25" y="30" width="270" height="100" rx="12" fill="#172033" stroke="#c6a6ff" />
    <text x="160.0" y="68" text-anchor="middle" fill="#c6a6ff" font-size="23" font-weight="600">

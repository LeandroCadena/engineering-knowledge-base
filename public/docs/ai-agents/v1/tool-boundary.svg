    </text>
    <rect x="365" y="30" width="270" height="100" rx="12" fill="#172033" stroke="#c6a6ff" />
    <text x="500.0" y="68" text-anchor="middle" fill="#c6a6ff" font-size="23" font-weight="600">
      Execution policy
    </text>
    <text x="500.0" y="104" text-anchor="middle" fill="#e2e8f0" font-size="19">

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="355" viewBox="0 0 1000 355" role="img" aria-labelledby="title desc"><title id="title">JWT acceptance boundaries</title><desc id="desc">The exact encoded header and payload form the signing input. A trusted key verifies its signature, then recipient policy validates claims, and resource policy checks authorization.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8da3b8"/></marker></defs><rect width="1000" height="355" rx="20" fill="#0d1828"/><path d="M180 125 V225" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="195" y="185" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">exact bytes</text><path d="M530 125 V170 H320 V245" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M320 267 H390" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="335" y="250" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">pass</text><path d="M670 267 H740" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="685" y="250" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">pass</text><rect x="40" y="40" width="280" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="180.0" y="71" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Encoded header</text><text x="180.0" y="99" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Algorithm, key ID, type</text><rect x="390" y="40" width="280" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="530.0" y="71" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Encoded claim set</text><text x="530.0" y="99" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Issuer, audience, subject</text><rect x="40" y="225" width="280" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="180.0" y="256" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Signature verification</text><text x="180.0" y="284" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Trusted key + algorithm</text><rect x="390" y="225" width="280" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="530.0" y="256" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Claims policy</text><text x="530.0" y="284" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Issuer, audience, type, time</text><rect x="740" y="225" width="220" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="850.0" y="256" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Resource policy</text><text x="850.0" y="284" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Scope + ownership</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370" role="img" aria-labelledby="title desc"><title id="title">Planned key rotation</title><desc id="desc">Publish the next public key before switching issuance. Retain the previous public key until its accepted tokens expire, then remove it. Emergency compromise needs separate policy.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8da3b8"/></marker></defs><rect width="1000" height="370" rx="20" fill="#0d1828"/><path d="M320 82 H390" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M670 82 H740" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M180 125 V240" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M530 125 V240" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M850 125 V240" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="40" width="280" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="180.0" y="71" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Before switch</text><text x="180.0" y="99" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Sign with key A</text><rect x="390" y="40" width="280" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="530.0" y="71" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">During overlap</text><text x="530.0" y="99" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Sign with key B</text><rect x="740" y="40" width="220" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="850.0" y="71" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">After retirement</text><text x="850.0" y="99" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Sign with key B</text><rect x="40" y="240" width="280" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="180.0" y="271" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Publish A + B</text><text x="180.0" y="299" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">B available before use</text><rect x="390" y="240" width="280" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="530.0" y="271" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Publish A + B</text><text x="530.0" y="299" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Old A tokens still verify</text><rect x="740" y="240" width="220" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="850.0" y="271" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Publish B</text><text x="850.0" y="299" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">A tokens expired</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc"><title id="title">Identity before session establishment</title><desc id="desc">The callback and token exchange precede ID Token validation. Only a validated issuer-subject identity can be mapped to an account and rotate the browser session.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8da3b8"/></marker></defs><rect width="1000" height="380" rx="20" fill="#0d1828"/><path d="M310 82 H390" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M660 82 H720" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M840 125 V250" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="855" y="190" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">valid</text><path d="M720 292 H660" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M390 292 H310" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="40" width="270" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="175.0" y="71" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Pending login</text><text x="175.0" y="99" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Browser-bound transaction</text><rect x="390" y="40" width="270" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="525.0" y="71" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Code exchange</text><text x="525.0" y="99" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Trusted token endpoint</text><rect x="720" y="40" width="240" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="840.0" y="71" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">ID Token checks</text><text x="840.0" y="99" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Claims and nonce</text><rect x="720" y="250" width="240" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="840.0" y="281" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Local account</text><text x="840.0" y="309" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Issuer + subject</text><rect x="390" y="250" width="270" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="525.0" y="281" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Session rotation</text><text x="525.0" y="309" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">New ID and CSRF proof</text><rect x="40" y="250" width="270" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="175.0" y="281" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Browser credential</text><text x="175.0" y="309" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Fresh opaque cookie</text></svg>
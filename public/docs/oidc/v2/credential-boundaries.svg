<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">Credential recipients</title><desc id="desc">The application consumes the ID Token, sends the access token to the protected API, and maintains an opaque cookie session with the browser.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8da3b8"/></marker></defs><rect width="1000" height="420" rx="20" fill="#0d1828"/><path d="M280 82 H420" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="310" y="65" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">cookie</text><path d="M760 332 H730 V145 H620 V125" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="745" y="240" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">ID Token</text><path d="M560 125 V290" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="435" y="225" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">access token</text><rect x="40" y="40" width="240" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="160.0" y="71" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Browser</text><text x="160.0" y="99" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Opaque session cookie</text><rect x="420" y="40" width="280" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="560.0" y="71" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Application / RP</text><text x="560.0" y="99" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Validate identity; hold tokens</text><rect x="420" y="290" width="280" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="560.0" y="321" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Protected API</text><text x="560.0" y="349" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Validate API access</text><rect x="760" y="290" width="210" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="865.0" y="321" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Provider</text><text x="865.0" y="349" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Authenticate user</text></svg>
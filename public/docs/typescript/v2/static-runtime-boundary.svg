<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="625" viewBox="0 0 1000 625" role="img" aria-labelledby="title desc"><title id="title">Static and runtime boundaries</title><desc id="desc">Source is checked and emitted without erased types. External values require runtime validation before domain operations.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8da3b8"/></marker></defs><rect width="1000" height="625" rx="20" fill="#0d1828"/><path d="M300 87 H370" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M630 87 H700" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="647" y="72" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">emit</text><path d="M830 130 V260" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="845" y="202" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">execute</text><path d="M300 302 H370" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M630 302 H700" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="646" y="287" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">valid</text><path d="M500 345 V440" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="515" y="396" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">invalid</text><rect x="40" y="45" width="260" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="170.0" y="76" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">TypeScript source</text><text x="170.0" y="104" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Values + type descriptions</text><rect x="370" y="45" width="260" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="500.0" y="76" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Compiler check</text><text x="500.0" y="104" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Compatibility and flow</text><rect x="700" y="45" width="260" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="830.0" y="76" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Emitted JavaScript</text><text x="830.0" y="104" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Erased annotations</text><rect x="40" y="260" width="260" height="85" rx="12" fill="#142438" stroke="#ef939d" stroke-width="2"/><text x="170.0" y="291" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">External input</text><text x="170.0" y="319" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Unknown JSON value</text><rect x="370" y="260" width="260" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="500.0" y="291" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Runtime parser</text><text x="500.0" y="319" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Inspect and reconstruct</text><rect x="700" y="260" width="260" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="830.0" y="291" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Domain operation</text><text x="830.0" y="319" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Receives accepted data</text><rect x="370" y="440" width="260" height="85" rx="12" fill="#142438" stroke="#ef939d" stroke-width="2"/><text x="500.0" y="471" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Invalid input</text><text x="500.0" y="499" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Return error or throw</text><text x="500" y="585" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="18">The emitted code contains the parser implementation, not the erased input type.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc"><title id="title">Validation and discriminated results</title><desc id="desc">Unknown data is validated into a success or failure result; checking ok narrows the available payload.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8da3b8"/></marker></defs><rect width="1000" height="610" rx="20" fill="#0d1828"/><path d="M300 87 H370" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M630 87 H700" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M830 130 V240" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="845" y="190" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">accepted</text><path d="M700 105 H670 V200 H500 V240" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="520" y="187" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">rejected</text><path d="M830 325 V430" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="845" y="385" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">if (result.ok)</text><path d="M500 325 V430" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="515" y="385" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">else</text><rect x="40" y="45" width="260" height="85" rx="12" fill="#142438" stroke="#ef939d" stroke-width="2"/><text x="170.0" y="76" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">unknown input</text><text x="170.0" y="104" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">No trusted shape</text><rect x="370" y="45" width="260" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="500.0" y="76" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">parseOrder</text><text x="500.0" y="104" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Runtime checks</text><rect x="700" y="45" width="260" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="830.0" y="76" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Result&lt;CreateOrder&gt;</text><text x="830.0" y="104" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Two valid alternatives</text><rect x="700" y="240" width="260" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="830.0" y="271" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">ok: true</text><text x="830.0" y="299" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">value: CreateOrder</text><rect x="370" y="240" width="260" height="85" rx="12" fill="#142438" stroke="#ef939d" stroke-width="2"/><text x="500.0" y="271" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">ok: false</text><text x="500.0" y="299" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">error: code + message</text><rect x="700" y="430" width="260" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="830.0" y="461" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Success branch</text><text x="830.0" y="489" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Use value.sku</text><rect x="370" y="430" width="260" height="85" rx="12" fill="#142438" stroke="#ef939d" stroke-width="2"/><text x="500.0" y="461" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Failure branch</text><text x="500.0" y="489" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Use error.message</text><text x="500" y="570" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="18">Narrowing follows the declared relationship; validation establishes it for external data.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc"><title id="title">Reject stale ownership at the resource</title><desc id="desc">Worker B writes with token 42. The resource persists that generation and rejects a later write from worker A carrying token 41.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker></defs><rect width="760" height="460" rx="18" fill="#101827"/><g font-family="system-ui,sans-serif"><rect x="30" y="25" width="310" height="70" rx="13" fill="#1d2b40" stroke="#f5ce76" stroke-width="2"/><text x="185.0" y="69.0" fill="#e5edf8" font-size="25" text-anchor="middle"><tspan x="185.0" dy="0">Worker A · token 41</tspan></text><rect x="420" y="25" width="310" height="70" rx="13" fill="#1d2b40" stroke="#75dfb5" stroke-width="2"/><text x="575.0" y="69.0" fill="#e5edf8" font-size="25" text-anchor="middle"><tspan x="575.0" dy="0">Worker B · token 42</tspan></text><text x="185" y="140" fill="#f5ce76" font-size="24" text-anchor="middle"><tspan x="185" dy="0">Pauses; lease expires</tspan></text><path d="M575 95 L575 220" fill="none" stroke="#75dfb5" stroke-width="3" marker-end="url(#arrow)"/><text x="650" y="185" fill="#75dfb5" font-size="24" text-anchor="middle"><tspan x="650" dy="0">Write 42</tspan></text><rect x="250" y="235" width="480" height="95" rx="13" fill="#1d2b40" stroke="#75dfb5" stroke-width="2"/><text x="490.0" y="274.5" fill="#e5edf8" font-size="25" text-anchor="middle"><tspan x="490.0" dy="0">Resource accepts 42</tspan><tspan x="490.0" dy="34">Stores highest token: 42</tspan></text><path d="M185 155 L185 370" fill="none" stroke="#ff8498" stroke-width="3" marker-end="url(#arrow)"/><path d="M185 370 L350 370" fill="none" stroke="#ff8498" stroke-width="3" marker-end="url(#arrow)"/><text x="180" y="425" fill="#ff8498" font-size="24" text-anchor="middle"><tspan x="180" dy="0">A resumes</tspan></text><rect x="365" y="340" width="365" height="80" rx="13" fill="#1d2b40" stroke="#ff8498" stroke-width="2"/><text x="547.5" y="389.0" fill="#e5edf8" font-size="25" text-anchor="middle"><tspan x="547.5" dy="0">Write 41 → rejected</tspan></text></g></svg>

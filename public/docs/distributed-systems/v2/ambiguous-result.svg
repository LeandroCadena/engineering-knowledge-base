<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc"><title id="title">A saved reservation can have no received response</title><desc id="desc">The server commits stock and a receipt. The response is lost, so the client cannot infer whether the effect occurred.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker></defs><rect width="760" height="460" rx="18" fill="#101827"/><g font-family="system-ui,sans-serif"><rect x="20" y="20" width="180" height="56" rx="13" fill="#1d2b40" stroke="#68b9ff" stroke-width="2"/><text x="110.0" y="57.0" fill="#e5edf8" font-size="25" text-anchor="middle"><tspan x="110.0" dy="0">Client</tspan></text><rect x="560" y="20" width="180" height="56" rx="13" fill="#1d2b40" stroke="#68b9ff" stroke-width="2"/><text x="650.0" y="57.0" fill="#e5edf8" font-size="25" text-anchor="middle"><tspan x="650.0" dy="0">Server</tspan></text><path d="M110 80V430 M650 80V430" stroke="#3a4b65" stroke-width="2" stroke-dasharray="7 7"/><path d="M110 125 L650 125" fill="none" stroke="#68b9ff" stroke-width="3" marker-end="url(#arrow)"/><text x="380" y="108" fill="#e5edf8" font-size="25" text-anchor="middle"><tspan x="380" dy="0">Reserve 1 · key K</tspan></text><rect x="450" y="155" width="290" height="92" rx="13" fill="#1d2b40" stroke="#75dfb5" stroke-width="2"/><text x="595.0" y="193.0" fill="#e5edf8" font-size="25" text-anchor="middle"><tspan x="595.0" dy="0">Stock: 1 → 0</tspan><tspan x="595.0" dy="34">Receipt saved</tspan></text><path d="M650 295 L155 295" fill="none" stroke="#ff8498" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/><text x="380" y="275" fill="#ff8498" font-size="25" text-anchor="middle"><tspan x="380" dy="0">Response lost</tspan></text><path d="M365 281l28 28m0-28l-28 28" stroke="#ff8498" stroke-width="5"/><rect x="20" y="340" width="260" height="90" rx="13" fill="#1d2b40" stroke="#f5ce76" stroke-width="2"/><text x="150.0" y="377.0" fill="#e5edf8" font-size="25" text-anchor="middle"><tspan x="150.0" dy="0">Client outcome:</tspan><tspan x="150.0" dy="34">unknown</tspan></text></g></svg>

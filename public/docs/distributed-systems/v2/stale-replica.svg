<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc"><title id="title">An acknowledged write can precede follower catch-up</title><desc id="desc">The leader has saved stock zero. An asynchronous follower still shows one. Reading it can violate the session read-your-writes expectation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker></defs><rect width="760" height="460" rx="18" fill="#101827"/><g font-family="system-ui,sans-serif"><rect x="230" y="20" width="300" height="65" rx="13" fill="#1d2b40" stroke="#68b9ff" stroke-width="2"/><text x="380.0" y="61.5" fill="#e5edf8" font-size="25" text-anchor="middle"><tspan x="380.0" dy="0">Reservation confirmed</tspan></text><rect x="40" y="135" width="290" height="100" rx="13" fill="#1d2b40" stroke="#75dfb5" stroke-width="2"/><text x="185.0" y="177.0" fill="#e5edf8" font-size="25" text-anchor="middle"><tspan x="185.0" dy="0">Leader</tspan><tspan x="185.0" dy="34">Stock: 0</tspan></text><rect x="430" y="135" width="290" height="100" rx="13" fill="#1d2b40" stroke="#f5ce76" stroke-width="2"/><text x="575.0" y="177.0" fill="#e5edf8" font-size="25" text-anchor="middle"><tspan x="575.0" dy="0">Follower</tspan><tspan x="575.0" dy="34">Stock: 1</tspan></text><path d="M330 185 L430 185" fill="none" stroke="#f5ce76" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/><text x="380" y="120" fill="#f5ce76" font-size="23" text-anchor="middle"><tspan x="380" dy="0">Replication lag</tspan></text><path d="M575 235 L575 315" fill="none" stroke="#f5ce76" stroke-width="3" marker-end="url(#arrow)"/><rect x="390" y="325" width="340" height="95" rx="13" fill="#1d2b40" stroke="#f5ce76" stroke-width="2"/><text x="560.0" y="364.5" fill="#e5edf8" font-size="25" text-anchor="middle"><tspan x="560.0" dy="0">Read from follower:</tspan><tspan x="560.0" dy="34">old stock is visible</tspan></text><rect x="40" y="325" width="290" height="95" rx="13" fill="#1d2b40" stroke="#75dfb5" stroke-width="2"/><text x="185.0" y="364.5" fill="#e5edf8" font-size="25" text-anchor="middle"><tspan x="185.0" dy="0">Session expects:</tspan><tspan x="185.0" dy="34">its saved change</tspan></text></g></svg>

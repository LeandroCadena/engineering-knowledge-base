<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc"><title id="title">A lost acknowledgment causes safe redelivery with an inbox</title><desc id="desc">The consumer commits event identity and its local effect together. A lost acknowledgment causes redelivery, which finds the recorded event and skips the effect.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker></defs><rect width="760" height="460" rx="18" fill="#101827"/><g font-family="system-ui,sans-serif"><rect x="30" y="20" width="250" height="65" rx="13" fill="#1d2b40" stroke="#68b9ff" stroke-width="2"/><text x="155.0" y="61.5" fill="#e5edf8" font-size="25" text-anchor="middle"><tspan x="155.0" dy="0">Broker · event E</tspan></text><rect x="475" y="20" width="255" height="65" rx="13" fill="#1d2b40" stroke="#68b9ff" stroke-width="2"/><text x="602.5" y="61.5" fill="#e5edf8" font-size="25" text-anchor="middle"><tspan x="602.5" dy="0">Consumer</tspan></text><path d="M280 52 L475 52" fill="none" stroke="#68b9ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="370" y="125" width="360" height="95" rx="13" fill="#1d2b40" stroke="#75dfb5" stroke-width="2"/><text x="550.0" y="164.5" fill="#e5edf8" font-size="25" text-anchor="middle"><tspan x="550.0" dy="0">Transaction:</tspan><tspan x="550.0" dy="34">Effect + event ID E</tspan></text><path d="M600 85 L600 125" fill="none" stroke="#75dfb5" stroke-width="3" marker-end="url(#arrow)"/><path d="M475 260 L95 260" fill="none" stroke="#ff8498" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/><text x="285" y="238" fill="#ff8498" font-size="24" text-anchor="middle"><tspan x="285" dy="0">Ack lost after commit</tspan></text><path d="M95 300 L95 350" fill="none" stroke="#68b9ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M95 350 L370 350" fill="none" stroke="#68b9ff" stroke-width="3" marker-end="url(#arrow)"/><text x="200" y="330" fill="#68b9ff" font-size="24" text-anchor="middle"><tspan x="200" dy="0">Redeliver E</tspan></text><rect x="375" y="315" width="355" height="100" rx="13" fill="#1d2b40" stroke="#75dfb5" stroke-width="2"/><text x="552.5" y="357.0" fill="#e5edf8" font-size="25" text-anchor="middle"><tspan x="552.5" dy="0">E already recorded:</tspan><tspan x="552.5" dy="34">no repeated effect</tspan></text></g></svg>

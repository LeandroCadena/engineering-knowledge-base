<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc"><title id="title">Save the effect and receipt together</title><desc id="desc">A new intent commits the stock mutation and successful receipt in one transaction. The same key and input replay that receipt.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker></defs><rect width="760" height="460" rx="18" fill="#101827"/><g font-family="system-ui,sans-serif"><rect x="240" y="20" width="280" height="65" rx="13" fill="#1d2b40" stroke="#68b9ff" stroke-width="2"/><text x="380.0" y="61.5" fill="#e5edf8" font-size="25" text-anchor="middle"><tspan x="380.0" dy="0">Key K · reserve 1</tspan></text><path d="M380 85 L380 140" fill="none" stroke="#68b9ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="35" y="145" width="690" height="155" rx="16" fill="#142b2b" stroke="#75dfb5" stroke-width="2"/><text x="380" y="180" fill="#75dfb5" font-size="25" text-anchor="middle"><tspan x="380" dy="0">One database transaction</tspan></text><rect x="65" y="207" width="280" height="65" rx="13" fill="#1d2b40" stroke="#75dfb5" stroke-width="2"/><text x="205.0" y="248.5" fill="#e5edf8" font-size="25" text-anchor="middle"><tspan x="205.0" dy="0">Stock: 1 → 0</tspan></text><rect x="415" y="207" width="280" height="65" rx="13" fill="#1d2b40" stroke="#75dfb5" stroke-width="2"/><text x="555.0" y="248.5" fill="#e5edf8" font-size="25" text-anchor="middle"><tspan x="555.0" dy="0">K → receipt R</tspan></text><path d="M380 300 L380 350" fill="none" stroke="#68b9ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="355" width="460" height="75" rx="13" fill="#1d2b40" stroke="#68b9ff" stroke-width="2"/><text x="380.0" y="401.5" fill="#e5edf8" font-size="25" text-anchor="middle"><tspan x="380.0" dy="0">Retry K → replay receipt R</tspan></text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc"><title id="title">A partition divides a fixed three-voter Raft group</title><desc id="desc">Two communicating voters form a majority and may commit after a valid election. The isolated voter cannot commit independently.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker></defs><rect width="760" height="460" rx="18" fill="#101827"/><g font-family="system-ui,sans-serif"><rect x="25" y="25" width="425" height="405" rx="16" fill="#142b2b" stroke="#75dfb5"/><rect x="500" y="25" width="235" height="405" rx="16" fill="#302332" stroke="#ff8498"/><text x="237" y="65" fill="#75dfb5" font-size="25" text-anchor="middle"><tspan x="237" dy="0">Connected majority</tspan></text><text x="617" y="65" fill="#ff8498" font-size="25" text-anchor="middle"><tspan x="617" dy="0">Isolated voter</tspan></text><rect x="55" y="100" width="150" height="75" rx="13" fill="#1d2b40" stroke="#75dfb5" stroke-width="2"/><text x="130.0" y="146.5" fill="#e5edf8" font-size="25" text-anchor="middle"><tspan x="130.0" dy="0">A</tspan></text><rect x="270" y="100" width="150" height="75" rx="13" fill="#1d2b40" stroke="#75dfb5" stroke-width="2"/><text x="345.0" y="146.5" fill="#e5edf8" font-size="25" text-anchor="middle"><tspan x="345.0" dy="0">B</tspan></text><path d="M205 138 L270 138" fill="none" stroke="#75dfb5" stroke-width="3" marker-end="url(#arrow)"/><rect x="535" y="100" width="165" height="75" rx="13" fill="#1d2b40" stroke="#ff8498" stroke-width="2"/><text x="617.5" y="146.5" fill="#e5edf8" font-size="25" text-anchor="middle"><tspan x="617.5" dy="0">C</tspan></text><path d="M475 90V390" stroke="#ff8498" stroke-width="3" stroke-dasharray="9 8"/><text x="237" y="245" fill="#75dfb5" font-size="25" text-anchor="middle"><tspan x="237" dy="0">2 of 3 voters</tspan></text><text x="237" y="300" fill="#e5edf8" font-size="26" text-anchor="middle"><tspan x="237" dy="0">Can commit after</tspan><tspan x="237" dy="34">a valid election</tspan></text><text x="617" y="245" fill="#ff8498" font-size="25" text-anchor="middle"><tspan x="617" dy="0">1 of 3</tspan></text><text x="617" y="300" fill="#e5edf8" font-size="26" text-anchor="middle"><tspan x="617" dy="0">Cannot</tspan><tspan x="617" dy="34">commit alone</tspan></text></g></svg>

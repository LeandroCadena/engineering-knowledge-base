<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#94abc0"/></marker></defs><rect width="1000" height="430" rx="20" fill="#0d1928"/><rect x="35" y="55" width="260" height="88" rx="12" fill="#17283b" stroke="#57bde9" stroke-width="2"/><text x="165.0" y="88" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#dceaf7">BEGIN IMMEDIATE</text><text x="165.0" y="117" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#b8cce0">One connection</text><rect x="370" y="55" width="260" height="88" rx="12" fill="#17283b" stroke="#b9a0f5" stroke-width="2"/><text x="500.0" y="88" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#dceaf7">Reserve stock</text><text x="500.0" y="117" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#b8cce0">Conditional UPDATE</text><rect x="705" y="55" width="260" height="88" rx="12" fill="#17283b" stroke="#57bde9" stroke-width="2"/><text x="835.0" y="88" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#dceaf7">Insert order</text><text x="835.0" y="117" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#b8cce0">Same transaction</text><path d="M295 99 H370" fill="none" stroke="#94abc0" stroke-width="2" marker-end="url(#arrow)"/><path d="M630 99 H705" fill="none" stroke="#94abc0" stroke-width="2" marker-end="url(#arrow)"/><rect x="370" y="280" width="260" height="88" rx="12" fill="#17283b" stroke="#fb9b9b" stroke-width="2"/><text x="500.0" y="313" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#dceaf7">ROLLBACK</text><text x="500.0" y="342" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#b8cce0">Restore reservation</text><rect x="705" y="280" width="260" height="88" rx="12" fill="#17283b" stroke="#4bddb3" stroke-width="2"/><text x="835.0" y="313" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#dceaf7">COMMIT</text><text x="835.0" y="342" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#b8cce0">Keep both writes</text><path d="M835 143 V280" fill="none" stroke="#94abc0" stroke-width="2" marker-end="url(#arrow)"/><path d="M770 143 V213 H500 V280" fill="none" stroke="#94abc0" stroke-width="2" marker-end="url(#arrow)"/><text x="886" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#dceaf7">Success</text><text x="623" y="202" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#dceaf7">Insert throws</text><text x="163" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#dceaf7">No external effect</text><text x="163" y="289" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#dceaf7">joins this transaction</text><text x="500" y="405" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#b8cce0">The callback must finish before commit.</text></svg>
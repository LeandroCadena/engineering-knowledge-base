<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#91a8bd"/></marker></defs><rect width="1000" height="470" rx="20" fill="#0d1928"/><rect x="40" y="40" width="270" height="85" rx="12" fill="#17283b" stroke="#57bde9" stroke-width="2"/><text x="175.0" y="71" fill="#dfeefa" text-anchor="middle" font-family="Arial,sans-serif" font-size="21">Authorized Action</text><text x="175.0" y="100" fill="#b8cce0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">Validate input + version</text><rect x="380" y="40" width="270" height="85" rx="12" fill="#17283b" stroke="#b9a0f5" stroke-width="2"/><text x="515.0" y="71" fill="#dfeefa" text-anchor="middle" font-family="Arial,sans-serif" font-size="21">Database commit</text><text x="515.0" y="100" fill="#b8cce0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">Conditional update</text><rect x="720" y="40" width="240" height="85" rx="12" fill="#17283b" stroke="#4bddb3" stroke-width="2"/><text x="840.0" y="71" fill="#dfeefa" text-anchor="middle" font-family="Arial,sans-serif" font-size="21">updateTag</text><text x="840.0" y="100" fill="#b8cce0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">Expire shared entry</text><path d="M310 82 H380" fill="none" stroke="#91a8bd" stroke-width="2" marker-end="url(#arrow)"/><path d="M650 82 H720" fill="none" stroke="#91a8bd" stroke-width="2" marker-end="url(#arrow)"/><rect x="630" y="280" width="330" height="85" rx="12" fill="#17283b" stroke="#57bde9" stroke-width="2"/><text x="795.0" y="311" fill="#dfeefa" text-anchor="middle" font-family="Arial,sans-serif" font-size="21">Next affected read</text><text x="795.0" y="340" fill="#b8cce0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">Waits for fresh data</text><path d="M840 125 V280" fill="none" stroke="#91a8bd" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="280" width="430" height="85" rx="12" fill="#17283b" stroke="#4bddb3" stroke-width="2"/><text x="255.0" y="311" fill="#dfeefa" text-anchor="middle" font-family="Arial,sans-serif" font-size="21">Updated public UI</text><text x="255.0" y="340" fill="#b8cce0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">Path refresh selects new cached result</text><path d="M630 322 H470" fill="none" stroke="#91a8bd" stroke-width="2" marker-end="url(#arrow)"/><text x="500" y="425" fill="#dfeefa" text-anchor="middle" font-family="Arial,sans-serif" font-size="18">A database write alone does not automatically invalidate this cache</text></svg>
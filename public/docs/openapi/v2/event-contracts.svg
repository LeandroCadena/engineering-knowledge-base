<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc"><title id="title">Callbacks and webhooks</title><desc id="desc">A callback is related to an initiating operation and can derive its destination from that request. A top-level webhook describes an independent incoming event contract for consumers.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8da3b8"/></marker></defs><rect width="1000" height="590" rx="20" fill="#0d1828"/><path d="M320 87 H400" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M540 130 V245" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="555" y="195" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">later</text><path d="M400 287 H320" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="322" y="270" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">callback</text><path d="M400 507 H320" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="322" y="490" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">webhook</text><path d="M730 507 H680" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="45" width="280" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="180.0" y="76" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Consumer starts operation</text><text x="180.0" y="104" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Request contains callback URL</text><rect x="400" y="45" width="280" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="540.0" y="76" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Provider operation</text><text x="540.0" y="104" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Parent of callback definition</text><rect x="400" y="245" width="280" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="540.0" y="276" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Provider sends callback</text><text x="540.0" y="304" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Destination from that request</text><rect x="40" y="245" width="280" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="180.0" y="276" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Consumer endpoint</text><text x="180.0" y="304" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Receives callback request</text><rect x="400" y="465" width="280" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="540.0" y="496" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Provider event</text><text x="540.0" y="524" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Independent event occurrence</text><rect x="40" y="465" width="280" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="180.0" y="496" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Consumer event endpoint</text><text x="180.0" y="524" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Receives documented webhook</text><rect x="730" y="465" width="230" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="845.0" y="496" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">webhooks contract</text><text x="845.0" y="524" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Independent contract</text></svg>
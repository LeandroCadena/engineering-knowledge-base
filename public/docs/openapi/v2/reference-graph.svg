<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc"><title id="title">Operation and component references</title><desc id="desc">An operation selects a response and media schema, which references reusable components. A security definition only applies when a security requirement uses it.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8da3b8"/></marker></defs><rect width="1000" height="400" rx="20" fill="#0d1828"/><path d="M310 87 H390" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M660 87 H720" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="672" y="70" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">$ref</text><path d="M175 130 V275" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="190" y="210" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">$ref</text><path d="M310 108 H350 V230 H525 V275" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="380" y="214" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">applies</text><path d="M660 317 H720" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="672" y="300" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">uses</text><rect x="40" y="45" width="270" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="175.0" y="76" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">POST /orders</text><text x="175.0" y="104" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Operation + requestBody</text><rect x="390" y="45" width="270" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="525.0" y="76" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">201 response</text><text x="525.0" y="104" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Location + JSON media</text><rect x="720" y="45" width="240" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="840.0" y="76" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Order schema</text><text x="840.0" y="104" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Required public fields</text><rect x="40" y="275" width="270" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="175.0" y="306" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">CreateOrder schema</text><text x="175.0" y="334" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Accepted input only</text><rect x="390" y="275" width="270" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="525.0" y="306" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Security requirement</text><text x="525.0" y="334" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">bearerAuth applies here</text><rect x="720" y="275" width="240" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="840.0" y="306" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">bearerAuth definition</text><text x="840.0" y="334" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">HTTP bearer mechanism</text></svg>
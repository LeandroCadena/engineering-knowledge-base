<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="375" viewBox="0 0 1000 375" role="img" aria-labelledby="title desc"><title id="title">Authenticated session transition</title><desc id="desc">Successful authentication replaces the anonymous session ID and CSRF value. The old ID is invalidated rather than upgraded in place.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8da3b8"/></marker></defs><rect width="1000" height="375" rx="20" fill="#0d1828"/><path d="M310 82 H390" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M660 82 H720" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M175 125 V245" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="190" y="190" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">invalidated</text><path d="M840 125 V190 H525 V245" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M660 287 H720" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="40" width="270" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="175.0" y="71" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Anonymous session A</text><text x="175.0" y="99" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Random ID + CSRF A</text><rect x="390" y="40" width="270" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="525.0" y="71" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Identity validated</text><text x="525.0" y="99" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Atomic predecessor check</text><rect x="720" y="40" width="240" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="840.0" y="71" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Authenticated B</text><text x="840.0" y="99" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">New ID + CSRF B</text><rect x="40" y="245" width="270" height="85" rx="12" fill="#142438" stroke="#ef939d" stroke-width="2"/><text x="175.0" y="276" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Copied ID A</text><text x="175.0" y="304" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Lookup rejected</text><rect x="390" y="245" width="270" height="85" rx="12" fill="#142438" stroke="#ef939d" stroke-width="2"/><text x="525.0" y="276" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Logout B</text><text x="525.0" y="304" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Remove server state</text><rect x="720" y="245" width="240" height="85" rx="12" fill="#142438" stroke="#ef939d" stroke-width="2"/><text x="840.0" y="276" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Stale request B</text><text x="840.0" y="304" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Cannot recreate state</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="575" viewBox="0 0 1000 575" role="img" aria-labelledby="title desc"><title id="title">Shared session validity boundary</title><desc id="desc">Requests routed to either replica check common session state. Expiry and revocation must be enforced without stale requests recreating deleted records.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8da3b8"/></marker></defs><rect width="1000" height="575" rx="20" fill="#0d1828"/><path d="M290 82 H390" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M525 125 V185 H165 V245" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M525 125 V245" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M290 287 H340 V365 H780 V330" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M660 287 H720" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M840 330 V410 H525 V445" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="630" y="400" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">accepted state</text><rect x="40" y="40" width="250" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="165.0" y="71" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Browser credential</text><text x="165.0" y="99" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Same opaque session ID</text><rect x="390" y="40" width="270" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="525.0" y="71" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Request routing</text><text x="525.0" y="99" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Either replica</text><rect x="40" y="245" width="250" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="165.0" y="276" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Replica A</text><text x="165.0" y="304" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Session lookup</text><rect x="390" y="245" width="270" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="525.0" y="276" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Replica B</text><text x="525.0" y="304" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Session lookup</text><rect x="720" y="245" width="240" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="840.0" y="276" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Shared store</text><text x="840.0" y="304" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Expiry + revocation</text><rect x="390" y="445" width="270" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="525.0" y="476" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="20">Protected operation</text><text x="525.0" y="504" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Only after valid context</text></svg>
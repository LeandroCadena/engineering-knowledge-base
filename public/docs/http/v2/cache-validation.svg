<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="625" viewBox="0 0 1000 625" role="img" aria-labelledby="title desc"><title id="title">Cache reuse and validation</title><desc id="desc">A cache can serve a fresh response, validate a stored stale response, or replace it after an origin response indicates change.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8da3b8"/></marker></defs><rect width="1000" height="625" rx="20" fill="#0d1828"/><path d="M300 87 H700" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="475" y="70" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">yes</text><path d="M170 130 V245" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="185" y="190" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">no: validate if permitted</text><path d="M300 287 H380" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M640 287 H700" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="650" y="270" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">yes</text><path d="M510 330 V445" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="525" y="390" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">no</text><rect x="40" y="45" width="260" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="170.0" y="76" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Stored representation</text><text x="170.0" y="104" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Fresh and reusable?</text><rect x="700" y="45" width="260" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="830.0" y="76" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Serve stored content</text><text x="830.0" y="104" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">No origin round trip</text><rect x="40" y="245" width="260" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="170.0" y="276" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Conditional request</text><text x="170.0" y="304" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">If-None-Match: &quot;v1&quot;</text><rect x="380" y="245" width="260" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="510.0" y="276" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Origin comparison</text><text x="510.0" y="304" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Representation unchanged?</text><rect x="700" y="245" width="260" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="830.0" y="276" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">304 + metadata</text><text x="830.0" y="304" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Reuse stored body</text><rect x="380" y="445" width="260" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="510.0" y="476" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">200 + new content</text><text x="510.0" y="504" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Replace stored representation</text><text x="500" y="585" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="18">Storage permission, freshness and validation are different cache decisions.</text></svg>
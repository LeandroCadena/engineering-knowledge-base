<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="505" viewBox="0 0 1000 505" role="img" aria-labelledby="title desc"><title id="title">Version-checked writes</title><desc id="desc">Two clients hold version 1. After one update commits version 2, another write conditioned on version 1 fails without overwriting it.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8da3b8"/></marker></defs><rect width="1000" height="505" rx="20" fill="#0d1828"/><path d="M300 87 H380" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M640 87 H700" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="650" y="70" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">match</text><path d="M300 332 H380" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M640 332 H700" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="646" y="314" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">mismatch</text><path d="M830 130 V210 H510 V290" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="530" y="195" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">A committed before B checks</text><rect x="40" y="45" width="260" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="170.0" y="76" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Client A: If-Match &quot;v1&quot;</text><text x="170.0" y="104" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Prepared from version 1</text><rect x="380" y="45" width="260" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="510.0" y="76" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Atomic compare + write</text><text x="510.0" y="104" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Current version: 1</text><rect x="700" y="45" width="260" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="830.0" y="76" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Write accepted</text><text x="830.0" y="104" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">State becomes version 2</text><rect x="40" y="290" width="260" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="170.0" y="321" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Client B: If-Match &quot;v1&quot;</text><text x="170.0" y="349" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Also prepared from version 1</text><rect x="380" y="290" width="260" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="510.0" y="321" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Atomic compare + write</text><text x="510.0" y="349" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Current version: 2</text><rect x="700" y="290" width="260" height="85" rx="12" fill="#142438" stroke="#ef939d" stroke-width="2"/><text x="830.0" y="321" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">412 Precondition Failed</text><text x="830.0" y="349" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">State stays at version 2</text><text x="500" y="465" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="18">The storage owner must enforce comparison and mutation as one atomic decision.</text></svg>
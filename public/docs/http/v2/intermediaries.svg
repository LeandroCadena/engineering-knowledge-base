<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="445" viewBox="0 0 1000 445" role="img" aria-labelledby="title desc"><title id="title">Hop-specific protocol and trust</title><desc id="desc">A client request crosses separate connections through edge and gateway to the application. TLS and forwarded metadata require decisions at each boundary.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8da3b8"/></marker></defs><rect width="1000" height="445" rx="20" fill="#0d1828"/><path d="M240 110 H275" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M485 110 H520" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M730 110 H765" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M765 145 H730" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M520 145 H485" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M275 145 H240" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M380 165 V325" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="395" y="260" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">forwarded metadata</text><path d="M625 325 V210 H870 V165" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="680" y="245" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">validated boundary</text><rect x="30" y="80" width="210" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="135.0" y="111" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Client</text><text x="135.0" y="139" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Browser or service</text><rect x="275" y="80" width="210" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="380.0" y="111" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Edge / CDN</text><text x="380.0" y="139" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">TLS termination</text><rect x="520" y="80" width="210" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="625.0" y="111" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Gateway</text><text x="625.0" y="139" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Routing and limits</text><rect x="765" y="80" width="210" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="870.0" y="111" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Application</text><text x="870.0" y="139" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Business operation</text><rect x="275" y="325" width="455" height="85" rx="12" fill="#142438" stroke="#ef939d" stroke-width="2"/><text x="502.5" y="356" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Forwarded identity / protocol</text><text x="502.5" y="384" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Trust known proxies that overwrite client input</text><text x="135" y="55" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="18">HTTP/2 + TLS</text><text x="500" y="55" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="18">Independent connection</text><text x="868" y="55" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="18">HTTP/1.1 (example)</text></svg>
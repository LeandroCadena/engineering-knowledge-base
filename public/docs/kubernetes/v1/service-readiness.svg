<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 900 330"
  role="img"
  aria-label="Service selects matching Pods; only ready endpoints receive regular traffic"
>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#60a5fa" />
    </marker>
  </defs>
  <rect width="900" height="330" rx="16" fill="#0f172a" />
  <g font-family="system-ui,sans-serif">
    <rect x="280" y="24" width="340" height="90" rx="12" fill="#172033" stroke="#60a5fa" />
    <text x="450" y="60" text-anchor="middle" fill="#93c5fd" font-size="24">Service: demo-api</text>
    <text x="450" y="91" text-anchor="middle" fill="#e2e8f0" font-size="20">
      selector: app=demo-api
    </text>
    <path d="M350 114 235 205" stroke="#60a5fa" stroke-width="3" marker-end="url(#a)" />
    <path d="M550 114 665 205" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6" />
    <path d="M596 153 618 175M618 153 596 175" stroke="#fda4af" stroke-width="4" />
    <rect x="45" y="210" width="365" height="95" rx="12" fill="#172033" stroke="#86efac" />
    <text x="227" y="248" text-anchor="middle" fill="#86efac" font-size="24">Ready Pods</text>
    <text x="227" y="280" text-anchor="middle" fill="#e2e8f0" font-size="20">
      Eligible service endpoints
    </text>
    <rect x="490" y="210" width="365" height="95" rx="12" fill="#172033" stroke="#fda4af" />
    <text x="672" y="248" text-anchor="middle" fill="#fda4af" font-size="24">Unready Pod</text>
    <text x="672" y="280" text-anchor="middle" fill="#e2e8f0" font-size="20">
      Selected, but not eligible
    </text>
  </g>
</svg>

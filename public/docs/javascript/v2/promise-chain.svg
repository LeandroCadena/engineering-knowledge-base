<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="805" viewBox="0 0 1000 805" role="img" aria-labelledby="title desc"><title id="title">Promise reaction outcomes</title><desc id="desc">A fulfilled input invokes the fulfillment handler. Its return value or throw determines the next promise, and catch may recover or reject again.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8da3b8"/></marker></defs><rect width="1000" height="805" rx="20" fill="#0d1828"/><path d="M340 87 H440" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M440 107 H380 V200 H190 V240" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="220" y="186" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">return</text><path d="M590 130 V240" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="605" y="190" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">throw</text><path d="M590 325 V430" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M440 472 H380 V580 H190 V620" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="220" y="565" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">recover</text><path d="M590 515 V620" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="605" y="580" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">reject</text><rect x="40" y="45" width="300" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="190.0" y="76" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Fulfilled input promise</text><text x="190.0" y="104" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">then schedules a reaction</text><rect x="440" y="45" width="300" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="590.0" y="76" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Reaction handler</text><text x="590.0" y="104" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Runs after current work</text><rect x="40" y="240" width="300" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="190.0" y="271" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Return a value</text><text x="190.0" y="299" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Next promise fulfills</text><rect x="440" y="240" width="300" height="85" rx="12" fill="#142438" stroke="#ef939d" stroke-width="2"/><text x="590.0" y="271" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Throw an error</text><text x="590.0" y="299" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Next promise rejects</text><rect x="440" y="430" width="300" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="590.0" y="461" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">catch handler</text><text x="590.0" y="489" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Handles that rejection</text><rect x="40" y="620" width="300" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="190.0" y="651" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Return recovery value</text><text x="190.0" y="679" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Following promise fulfills</text><rect x="440" y="620" width="300" height="85" rx="12" fill="#142438" stroke="#ef939d" stroke-width="2"/><text x="590.0" y="651" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Throw / reject again</text><text x="590.0" y="679" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Following promise rejects</text><text x="500" y="765" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="18">Returning a promise makes the next promise adopt its outcome.</text></svg>
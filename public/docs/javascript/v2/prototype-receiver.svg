<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc"><title id="title">Lookup and call receiver</title><desc id="desc">Property lookup finds a method on a prototype, but a method call uses the original object as this. A detached call has no such receiver.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8da3b8"/></marker></defs><rect width="1000" height="460" rx="20" fill="#0d1828"/><path d="M300 87 H370" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="310" y="70" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">lookup</text><path d="M630 87 H700" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="642" y="70" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">if absent</text><path d="M170 130 V260" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="185" y="200" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">call form</text><path d="M300 302 H370" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M500 130 V260" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="515" y="200" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">found method</text><path d="M630 107 H665 V220 H830 V260" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="700" y="206" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">extract, then call</text><rect x="40" y="45" width="260" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="170.0" y="76" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">order instance</text><text x="170.0" y="104" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Own: id and quantity</text><rect x="370" y="45" width="260" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="500.0" y="76" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">orderPrototype</text><text x="500.0" y="104" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Own: describe()</text><rect x="700" y="45" width="260" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="830.0" y="76" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Object.prototype</text><text x="830.0" y="104" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Then null</text><rect x="40" y="260" width="260" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="170.0" y="291" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">order.describe()</text><text x="170.0" y="319" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Receiver: order</text><rect x="370" y="260" width="260" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="500.0" y="291" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Execute describe</text><text x="500.0" y="319" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Reads this.id / quantity</text><rect x="700" y="260" width="260" height="85" rx="12" fill="#142438" stroke="#ef939d" stroke-width="2"/><text x="830.0" y="291" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Detached describe()</text><text x="830.0" y="319" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">this: undefined in strict mode</text><text x="500" y="420" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="18">Where a method is found and which object receives the call are separate decisions.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc"><title id="title">Independent closure environments</title><desc id="desc">Each counter factory call creates a separate count binding. Increment and read closures from one call share that binding.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8da3b8"/></marker></defs><rect width="1000" height="590" rx="20" fill="#0d1828"/><path d="M245 125 V225" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="260" y="185" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">returns closures</text><path d="M755 125 V225" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="770" y="185" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">returns closures</text><path d="M245 310 V410" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="260" y="370" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">access binding</text><path d="M755 310 V410" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="770" y="370" fill="#b4c6d8" font-family="Arial,sans-serif" font-size="17">access binding</text><rect x="70" y="40" width="350" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="245.0" y="71" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">createCounter(): first call</text><text x="245.0" y="99" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Creates environment A</text><rect x="580" y="40" width="350" height="85" rx="12" fill="#142438" stroke="#65b4e4" stroke-width="2"/><text x="755.0" y="71" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">createCounter(): second call</text><text x="755.0" y="99" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Creates environment B</text><rect x="70" y="225" width="350" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="245.0" y="256" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">first.increment / first.read</text><text x="245.0" y="284" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Closures sharing environment A</text><rect x="580" y="225" width="350" height="85" rx="12" fill="#142438" stroke="#5ed1ad" stroke-width="2"/><text x="755.0" y="256" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">second.increment / second.read</text><text x="755.0" y="284" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Closures sharing environment B</text><rect x="70" y="410" width="350" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="245.0" y="441" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">A: count = 1</text><text x="245.0" y="469" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">After first.increment()</text><rect x="580" y="410" width="350" height="85" rx="12" fill="#142438" stroke="#b7a0f0" stroke-width="2"/><text x="755.0" y="441" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">B: count = 0</text><text x="755.0" y="469" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">No mutation in this environment</text><text x="500" y="550" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="18">A closure retains a binding. It does not freeze that binding at function creation.</text></svg>
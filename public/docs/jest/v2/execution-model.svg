<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">Jest execution model</title><desc id="desc">Discovered files are loaded in test environments, distributed to workers and combined in the report.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8da3b8"/></marker></defs><rect width="1000" height="520" rx="20" fill="#0d1828"/><path d="M300 80 H385" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M515 120 V180" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M645 80 H830 V180" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M515 260 V300 H670 V355" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><path d="M830 260 V300 H670" fill="none" stroke="#8da3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="40" width="260" height="80" rx="12" fill="#142438" stroke="#5ba9d9" stroke-width="2"/><text x="170.0" y="70" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Test discovery</text><text x="170.0" y="97" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Configuration + patterns</text><rect x="385" y="40" width="260" height="80" rx="12" fill="#142438" stroke="#5ba9d9" stroke-width="2"/><text x="515.0" y="70" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Load test files</text><text x="515.0" y="97" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Transform if configured</text><rect x="700" y="180" width="260" height="80" rx="12" fill="#142438" stroke="#5ecdb0" stroke-width="2"/><text x="830.0" y="210" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Worker A</text><text x="830.0" y="237" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Test file + environment</text><rect x="385" y="180" width="260" height="80" rx="12" fill="#142438" stroke="#5ecdb0" stroke-width="2"/><text x="515.0" y="210" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Worker B</text><text x="515.0" y="237" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Test file + environment</text><rect x="540" y="355" width="260" height="80" rx="12" fill="#142438" stroke="#5ba9d9" stroke-width="2"/><text x="670.0" y="385" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Combined report</text><text x="670.0" y="412" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Assertions and coverage</text><text x="500" y="480" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="18">Workers do not isolate shared database rows, ports or filesystem paths.</text></svg>
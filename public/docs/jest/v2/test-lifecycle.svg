rif" font-size="17">Shared setup</text><rect x="40" y="200" width="250" height="80" rx="12" fill="#142438" stroke="#5ecdb0" stroke-width="2"/><text x="165.0" y="230" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">beforeEach</text><text x="165.0" y="257" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Fresh test state</text><rect x="375" y="200" width="250" height="80" rx="12" fill="#142438" stroke="#5ba9d9" stroke-width="2"/><text x="500.0" y="230" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Test A</text><text x="500.0" y="257" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Await completion</text><rect x="710" y="200" width="250" height="80" rx="12" fill="#142438" stroke="#5ecdb0" stroke-width="2"/><text x="835.0" y="230" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">afterEach</text><text x="835.0" y="257" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Restore owned state</text><rect x="40" y="350" width="250" height="80" rx="12" fill="#142438" stroke="#5ecdb0" stroke-width="2"/><text x="165.0" y="380" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">beforeEach</text><text x="165.0" y="407" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Fresh test state</text><rect x="375" y="350" width="250" height="80" rx="12" fill="#142438" stroke="#5ba9d9" stroke-width="2"/><text x="500.0" y="380" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-serif" font-size="21">Test B</text><text x="500.0" y="407" text-anchor="middle" fill="#b8c9dc" font-family="Arial,sans-serif" font-size="17">Await completion</text><rect x="710" y="350" width="250" height="80" rx="12" fill="#142438" stroke="#5ecdb0" stroke-width="2"/><text x="835.0" y="380" text-anchor="middle" fill="#eff6ff" font-family="Arial,sans-s